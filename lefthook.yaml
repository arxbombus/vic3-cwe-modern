glob_matcher: doublestar

pre-commit:
  commands:
    ruff:
      root: scripts/
      glob: "**/*.py"
      run: mise exec -- uv run ruff check --fix {staged_files}
      stage_fixed: true

    format:
      root: scripts/
      glob: "**/*.py"
      run: mise exec -- uv run ruff format {staged_files}
      stage_fixed: true

    typecheck:
      root: scripts/
      glob:
        - "**/*.py"
        - "pyproject.toml"
      run: mise exec -- uv run ty check

pre-push:
  commands:
    check:
      run: mise run check

commit-msg:
  commands:
    sumi:
      run: mise exec -- git-sumi --file "{1}"
