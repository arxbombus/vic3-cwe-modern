# One manifest for the entire state-region workflow: source layering, broad
# resource changes, per-state edits, and optional Aurelia state splitting.

[source]
# Defaults may also come from app.toml. These values are intentionally named
# sources, and every value can be overridden from the CLI.
base_source = "vic3"
overlay_source = "cwe_local"
path = "map_data/state_regions"

# Bootstrap only: before the ownership file exists, ignore files already
# generated by this developer fork so they cannot become their own inputs.
# Explicit include_files always wins over these patterns.
bootstrap_exclude_globs = [
    "*_replace.txt",
    "00_modern_states.txt",
]
include_files = [
    "cwe_replacement_states.txt",
]

[output]
# Written below the configured mod root.
directory = "map_data/state_regions"
ownership_file = "scripts/.generated/map_data_state_regions.json"

[global]
# Set to 1.0 for no global change.
arable_land_multiplier = 1.0

[global.capped_resource_multipliers]
# building_coal_mine = 2.0
# building_iron_mine = 1.5

# Per-state edits. Only fields present here are changed.
#
# [states.STATE_SVEALAND]
# arable_land = 150
# add_traits = ["state_trait_example"]
# remove_traits = []
# add_arable_resources = ["building_wheat_farm"]
# remove_arable_resources = []
#
# [states.STATE_SVEALAND.capped_resources]
# building_coal_mine = { set = 100 }
# building_iron_mine = { multiply = 2.0 }
# building_logging_camp = { add = 10 }
#
# [[states.STATE_SVEALAND.resources]]
# type = "building_oil_rig"
# undiscovered_amount = 25

[aurelia]
enabled = false
# Authored source files kept under scripts/. The generator parses/formats these,
# then emits them into the mod when enabled.
states_input = "data/aurelia/00_modern_states.txt"
localization_input = "data/aurelia/0_modern_states_l_english.yml"
states_output = "map_data/state_regions/00_modern_states.txt"
localization_output = "localization/english/0_modern_states_l_english.yml"

# Existing vanilla/CWE states that must be disabled because their provinces
# have been split into new states.
disable_states = [
    "STATE_FORMOSA",
]

# Remove provinces from surviving source states. Keys below the state name are
# field names in the state block, so the same province can be removed from both
# `provinces` and `impassable` without a special parser rule.
[aurelia.remove_values.STATE_EAST_JAVA]
provinces = ["x5C2250"]
impassable = ["x5C2250"]

# Map locators can be supplied here when they are known. These edits are textual
# only; spline mesh regeneration remains a map-editor task.
[aurelia.locators.city]
source_entity = "map_object_locators_city"
output = "gfx/map/map_object_data/generated_map_object_locators_city.txt"

# Example entry. Add as many IDs as needed.
[aurelia.locators.city.instances."1500"]
position = [6862.471680, 0.0, 2061.066650]
rotation = [-0.0, -0.923253, -0.0, -0.384193]
scale = [1.0, 1.0, 1.0]
