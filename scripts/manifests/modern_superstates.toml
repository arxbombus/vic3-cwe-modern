version = 1

# This manifest is the single source of truth for the private, direct-formable
# superstates. Country tags listed in members are annexed whole. Territory tags
# are used only to derive the canonical state list for country formation.

[[superstate]]
tag = "ZGC"
name = "United States of Great Columbia"
adjective = "Great Columbian"
founders = ["USA"]
definition_founder = "USA"
history_files = ["north_american_states.txt", "pacific_states.txt"]
territory_tags = ["USA", "CAN", "LSK", "HAW", "NFL", "QUE"]
members = ["CAN", "LSK", "HAW", "NFL", "QUE", "CSC", "EUS", "WUS", "CUS", "SUS", "ASA", "TEX"]
exclude_states = ["STATE_EAST_MICRONESIA", "STATE_WEST_MICRONESIA", "STATE_TONGA"]
flag_script = '''
	@usa_canton_width = 0.5
	@usa_canton_height = @[ 1 / 13 * 7 ]

	pattern = "pattern_solid.tga"
	color1 = "white"

	colored_emblem = {
		texture = "ce_stripes_13.dds"
		color1 = "red"
		color2 = "red"
	}
	sub = {
		parent = "sub_USA_canton_24"
		instance = { scale = { @usa_canton_width @usa_canton_height } } # top left
	}
	colored_emblem = {
		texture = "ce_eagle_usa_simple.dds"
		color1 = "yellow"
		color2 = "white"
		instance = { scale = { 0.75 0.75 } position = { 0.75 0.5 } }
	}
'''

