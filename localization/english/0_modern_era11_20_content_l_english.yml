 mobilization_option_modern_autonomous_ground_logistics:0 "Autonomous Ground Logistics"
 mobilization_option_modern_ai_battle_management:0 "AI Battle Management"
 mobilization_option_modern_regenerative_field_medicine:0 "Regenerative Field Medicine"
