 combat_unit_type_airforce_11:0 "Adaptive Air Superiority Fighter"
 combat_unit_type_airforce_11_desc:0 "Sensor fusion, adaptive flight controls, and machine-speed threat analysis turn the air-superiority fighter into a node in a battlespace-wide combat network. Pilot and onboard intelligence share targeting, electronic warfare, and maneuver decisions fast enough to contest skies saturated with missiles, drones, and decoys."
 combat_unit_type_airforce_12:0 "Hypersonic Strike Fighter"
 combat_unit_type_airforce_12_desc:0 "Sustained hypersonic flight compresses the distance between detection and impact to minutes. Extreme-temperature structures, adaptive propulsion, and predictive guidance allow this strike fighter to penetrate defended airspace before conventional interceptors can assemble an effective response."
 combat_unit_type_airforce_13:0 "Autonomous Air Superiority Aircraft"
 combat_unit_type_airforce_13_desc:0 "An autonomous air-superiority aircraft can search, classify, maneuver, and engage without the physiological limits of a human cockpit. Distributed combat intelligence lets formations divide targets, sacrifice decoys, and reshape their tactics continuously as the electromagnetic environment changes."
 combat_unit_type_airforce_14:0 "Swarm Carrier Aircraft"
 combat_unit_type_airforce_14_desc:0 "Rather than carrying only weapons, the aircraft carries an expendable air force of its own. Reconnaissance drones, jammers, interceptors, and loitering munitions spill from internal bays and cooperate as a swarm, forcing an enemy to defend against hundreds of coordinated threats instead of one airframe."
 combat_unit_type_airforce_15:0 "Directed-Energy Combat Aircraft"
 combat_unit_type_airforce_15_desc:0 "High-density power systems make lasers and microwave weapons practical aboard combat aircraft. Missiles can be burned out of the sky, sensors blinded at line of sight, and lightly protected targets struck at the speed of light while kinetic weapons remain available for hardened objectives."
 combat_unit_type_airforce_16:0 "Stratospheric Combat Aircraft"
 combat_unit_type_airforce_16_desc:0 "Designed to fight above the weather and beyond the comfortable reach of ordinary aviation, stratospheric combat aircraft loiter at the edge of space for extraordinary periods. Long-range sensors, high-energy weapons, and thin-atmosphere propulsion turn altitude itself into armor and reach."
 combat_unit_type_airforce_17:0 "Near-Space Interceptor"
 combat_unit_type_airforce_17_desc:0 "Near-space interceptors patrol the boundary where aircraft, boost vehicles, and orbital systems begin to overlap. They climb into the upper atmosphere on demand, destroy hypersonic threats during vulnerable flight phases, and descend again without the infrastructure demanded by a true spacecraft."
 combat_unit_type_airforce_18:0 "Fusion-Powered Aerospace Fighter"
 combat_unit_type_airforce_18_desc:0 "Compact fusion power removes fuel endurance as the defining limit of military aviation. Vast electrical reserves feed propulsion, sensors, active protection, and directed-energy weapons, allowing a fighter to remain on station until maintenance or crew tolerance—not fuel—forces it home."
 combat_unit_type_airforce_19:0 "Orbital-Atmospheric Interceptor"
 combat_unit_type_airforce_19_desc:0 "Orbital-atmospheric interceptors are built to cross the old boundary between air defense and space control. They can meet descending spacecraft, hunt weapons in near orbit, and return to atmospheric combat with a maneuver envelope no conventional aircraft can match."
 combat_unit_type_airforce_20:0 "Autonomous Aerospace Combat Platform"
 combat_unit_type_airforce_20_desc:0 "A fully autonomous aerospace combat platform treats atmosphere, near-space, and orbital approaches as one continuous battlespace. Self-maintaining systems, machine command, and immense onboard energy reserves let it patrol for months, coordinating lesser craft as extensions of a single distributed combat intelligence."
 combat_unit_type_infantry_11:0 "Networked Combat Infantry"
 combat_unit_type_infantry_11_desc:0 "Every squad becomes a sensor and every soldier a terminal in a shared tactical network. Helmet displays, autonomous reconnaissance, precision navigation, and machine-assisted fire control let dispersed infantry fight with a common picture of threats that would once have required headquarters-level intelligence."
 combat_unit_type_infantry_12:0 "Powered Exoskeleton Infantry"
 combat_unit_type_infantry_12_desc:0 "Powered exoskeletons move armor, ammunition, sensors, and heavy weapons without exhausting the soldier inside them. Infantry can cross broken terrain at vehicle-like pace, survive recoil from weapons once considered crew-served, and carry protection that would otherwise make dismounted movement impossible."
 combat_unit_type_infantry_13:0 "Autonomous Mechanized Infantry"
 combat_unit_type_infantry_13_desc:0 "Autonomous carriers, unmanned fighting vehicles, and robotic breaching systems accompany infantry as permanent members of the unit rather than attached equipment. Human troops concentrate on judgment and control while machines absorb the most repetitive, exposed, and physically punishing work."
 combat_unit_type_infantry_14:0 "Drone-Integrated Infantry"
 combat_unit_type_infantry_14_desc:0 "Drone-integrated infantry fights beneath a permanent cloud of small autonomous machines. Scouts map rooms before entry, loitering munitions wait behind cover, electronic-warfare drones search for emitters, and resupply craft keep ammunition moving without exposing a logistics column."
 combat_unit_type_infantry_15:0 "Directed-Energy Infantry"
 combat_unit_type_infantry_15_desc:0 "Portable directed-energy weapons give infantry an answer to the dense drone and sensor environment surrounding modern battlefields. Lasers destroy fragile airborne targets with negligible flight time while microwave projectors disrupt electronics, optics, and unshielded machines without consuming conventional ammunition."
 combat_unit_type_infantry_16:0 "Adaptive Armor Infantry"
 combat_unit_type_infantry_16_desc:0 "Adaptive armor changes its protective behavior as threats arrive. Smart laminates stiffen before impact, active surfaces distort thermal and radar signatures, and distributed countermeasures intercept incoming projectiles, giving dismounted troops a survivability envelope once reserved for armored vehicles."
 combat_unit_type_infantry_17:0 "Cognitive Battlefield Infantry"
 combat_unit_type_infantry_17_desc:0 "Neural interfaces and cognitive assistants place targeting cues, navigation, translation, logistics, and threat prediction directly into the soldier’s decision loop. Units coordinate almost without radio traffic, but the line between trained instinct and machine suggestion becomes increasingly difficult to see."
 combat_unit_type_infantry_18:0 "Self-Sustaining Expeditionary Infantry"
 combat_unit_type_infantry_18_desc:0 "Closed-loop life support, field fabrication, autonomous logistics, and compact power systems allow expeditionary infantry to operate far beyond conventional supply webs. Ammunition components, spare parts, food supplements, and medical materials can be manufactured or recycled close to the front."
 combat_unit_type_infantry_19:0 "Synthetic Combined-Arms Infantry"
 combat_unit_type_infantry_19_desc:0 "Synthetic combined-arms infantry mixes biological soldiers, autonomous combatants, robotic carriers, and embedded fires into a single tactical organism. Roles are assigned dynamically according to terrain and casualties; the unit reorganizes itself while fighting rather than waiting for replacements or new orders."
 combat_unit_type_infantry_20:0 "Post-Human Combat Infantry"
 combat_unit_type_infantry_20_desc:0 "Post-human combat infantry is built around bodies and minds deliberately adapted for war. Cybernetic musculature, engineered metabolism, neural co-processors, and integrated protection allow soldiers to survive environments and operational tempos that would overwhelm an unmodified human force."
 combat_unit_type_artillery_11:0 "Networked Precision Artillery"
 combat_unit_type_artillery_11_desc:0 "Networked precision artillery receives targeting data directly from drones, satellites, aircraft, infantry sensors, and counter-battery radars. Guns fire briefly, relocate automatically, and place guided rounds onto coordinates before an enemy can reconstruct where the salvo originated."
 combat_unit_type_artillery_12:0 "Electromagnetic Artillery"
 combat_unit_type_artillery_12_desc:0 "Electromagnetic launchers replace chemical propellant with immense pulses of electrical energy. Hypervelocity projectiles reach distant targets with flatter trajectories and devastating kinetic force, while ammunition trains carry dense inert penetrators instead of mountains of explosive propellant."
 combat_unit_type_artillery_13:0 "Autonomous Precision Artillery"
 combat_unit_type_artillery_13_desc:0 "Autonomous precision batteries select firing positions, calculate solutions, load ammunition, and displace with minimal human intervention. Machine coordination lets dozens of scattered launchers time rounds to arrive together, creating massed fire without massing the guns themselves."
 combat_unit_type_artillery_14:0 "Robotic Fires Platform"
 combat_unit_type_artillery_14_desc:0 "Robotic fires platforms are built to remain exposed where crews could not. Uncrewed launchers disperse through ruins, forests, and prepared hides, accepting high attrition while cheap replacement vehicles and automated depots keep the fire network alive."
 combat_unit_type_artillery_15:0 "Hypersonic Missile Artillery"
 combat_unit_type_artillery_15_desc:0 "Hypersonic missile artillery reaches deep operational targets before they can move, disperse, or shelter. Mobile launchers threaten command centers, airfields, fleet facilities, and logistics nodes across an entire theater without depending on vulnerable manned aircraft."
 combat_unit_type_artillery_16:0 "Swarm Munition Artillery"
 combat_unit_type_artillery_16_desc:0 "Swarm munitions arrive as coordinated clouds rather than individual shells. Each weapon shares target information in flight, reallocating itself among vehicles, sensors, defenses, and decoys until the swarm has exhausted the battlefield’s most valuable exposed targets."
 combat_unit_type_artillery_17:0 "Directed-Energy Artillery"
 combat_unit_type_artillery_17_desc:0 "Directed-energy artillery concentrates grid-scale power into mobile laser and microwave batteries. The weapons trade explosive blast for precision, endurance, and almost instantaneous engagement, cutting down drones and missiles while burning through exposed sensors and electronics."
 combat_unit_type_artillery_18:0 "Orbital-Linked Fire Support"
 combat_unit_type_artillery_18_desc:0 "Orbital-linked fire support fuses terrestrial batteries with sensors and weapons far above the battlefield. Targets hidden beyond the horizon can be tracked continuously, and ground launchers can coordinate strikes with orbital platforms to attack from multiple geometries at once."
 combat_unit_type_artillery_19:0 "Cognitive Artillery Platform"
 combat_unit_type_artillery_19_desc:0 "Cognitive artillery systems forecast movement, deception, resupply, and counter-battery reactions before selecting a target. Instead of merely answering coordinates, the fire network reasons about the battle and spends ammunition where it expects the enemy to become vulnerable."
 combat_unit_type_artillery_20:0 "Planetary Precision Artillery"
 combat_unit_type_artillery_20_desc:0 "Planetary precision artillery turns distance into a logistical question rather than a tactical limitation. Global sensor coverage, extreme-range launch systems, and machine fire control allow surface forces to place destructive effects across continents with the responsiveness once associated with local artillery."
 ship_type_submarine_11:0 "Autonomous Attack Submarine"
 ship_type_submarine_11_desc:0 "Autonomous control systems let the attack submarine stalk contacts for long periods with a drastically reduced crew. Passive sensor fusion and machine navigation keep it quiet while unmanned auxiliaries probe waters too dangerous for the mother vessel."
 ship_type_submarine_12:0 "Hypersonic Arsenal Submarine"
 ship_type_submarine_12_desc:0 "Large hypersonic weapons turn the submarine into a concealed arsenal capable of striking ships, air defenses, and land targets before warning networks can react. The hull becomes less a torpedo boat than a mobile, submerged first-strike battery."
 ship_type_submarine_13:0 "Uncrewed Hunter Submarine"
 ship_type_submarine_13_desc:0 "With no crew to protect, the hunter submarine can dive deeper, remain submerged longer, and accept maneuvers that would injure human sailors. It is designed to wait almost motionless for weeks before accelerating violently to attack a detected contact."
 ship_type_submarine_14:0 "Drone Carrier Submarine"
 ship_type_submarine_14_desc:0 "Internal bays release autonomous underwater vehicles that scout, mine, jam, relay communications, and attack independently. A single submarine can spread a web of sensors and weapons across an ocean chokepoint without revealing its own position."
 ship_type_submarine_15:0 "Metamaterial Stealth Submarine"
 ship_type_submarine_15_desc:0 "Metamaterial coatings and actively controlled hull surfaces manipulate acoustic, magnetic, and electromagnetic signatures instead of merely dampening them. The submarine attempts not only to become quiet, but to make hostile sensors perceive the wrong object in the wrong place."
 ship_type_submarine_16:0 "Fusion Attack Submarine"
 ship_type_submarine_16_desc:0 "Compact fusion power gives the attack submarine immense endurance and electrical reserve without the acoustic compromises of older high-output plants. High-speed transit, directed-energy auxiliaries, and sustained sensor operation no longer compete so sharply for reactor capacity."
 ship_type_submarine_17:0 "Abyssal Sensor Submarine"
 ship_type_submarine_17_desc:0 "Abyssal sensor submarines use vast distributed arrays, seabed drones, and pressure-tolerant probes to turn the deep ocean into an intelligence domain. They can map distant propeller noise, thermal disturbances, and undersea infrastructure from depths beyond routine naval operations."
 ship_type_submarine_18:0 "Near-Space Linked Submarine"
 ship_type_submarine_18_desc:0 "Tight links to near-space relays give a submerged fleet access to targeting and navigation data without long exposure at the surface. Burst communications synchronize undersea weapons with aircraft, satellites, and surface fleets across planetary distances."
 ship_type_submarine_19:0 "Self-Sustaining Deep-Ocean Submarine"
 ship_type_submarine_19_desc:0 "Closed-loop stores, automated maintenance, and onboard fabrication let this submarine remain in deep water for extraordinary deployments. It carries not merely spare parts but the machine tools and raw feedstock needed to manufacture many replacements at sea."
 ship_type_submarine_20:0 "Pelagic Dominance Submarine"
 ship_type_submarine_20_desc:0 "The pelagic dominance submarine is a roaming undersea command system surrounded by autonomous scouts, weapons, decoys, and repair drones. It treats whole ocean basins as a continuous maneuver space and can prosecute a campaign without approaching a friendly port."
 ship_type_destroyer_11:0 "Autonomous Fleet Destroyer"
 ship_type_destroyer_11_desc:0 "An autonomous fleet destroyer couples dense sensors with machine-speed defensive control. It escorts larger ships by assigning missiles, drones, jammers, and guns against threats in fractions of a second, reducing the reaction delay that once defined fleet air defense."
 ship_type_destroyer_12:0 "Hypersonic Defense Destroyer"
 ship_type_destroyer_12_desc:0 "Hypersonic interceptors extend the destroyer’s defensive umbrella far beyond the horizon. The ship is designed to kill incoming boost and glide weapons early, before terminal maneuvers compress the engagement window to seconds."
 ship_type_destroyer_13:0 "Uncrewed Missile Destroyer"
 ship_type_destroyer_13_desc:0 "Removing most of the crew frees internal volume for missiles, power systems, and damage isolation. The uncrewed destroyer can be risked aggressively as a forward sensor and weapons node without accepting the political and human cost of losing a conventional escort."
 ship_type_destroyer_14:0 "Drone Screen Destroyer"
 ship_type_destroyer_14_desc:0 "Drone screen destroyers launch clouds of unmanned aircraft and surface craft to push the fleet’s defensive perimeter outward. The escorts hunt submarines, relay targeting, jam seekers, and physically interpose themselves between high-value ships and incoming weapons."
 ship_type_destroyer_15:0 "Directed-Energy Destroyer"
 ship_type_destroyer_15_desc:0 "High-energy lasers and microwave arrays transform close fleet defense. Instead of trading an expensive interceptor for every cheap drone or missile, the destroyer can engage repeatedly so long as its power and thermal systems can keep pace."
 ship_type_destroyer_16:0 "Fusion Fleet Destroyer"
 ship_type_destroyer_16_desc:0 "Fusion propulsion supplies the electrical appetite of sensors, defensive weapons, and high-speed maneuver without sacrificing endurance. The ship can accompany fast task forces indefinitely while maintaining a continuous high-power combat posture."
 ship_type_destroyer_17:0 "Adaptive Escort Destroyer"
 ship_type_destroyer_17_desc:0 "Adaptive escort systems reconfigure radar apertures, electronic warfare, weapon allocation, and even hull signature according to the threat environment. The destroyer changes its defensive personality from antisubmarine hunter to missile screen to electronic decoy without returning to port."
 ship_type_destroyer_18:0 "Orbital-Linked Destroyer"
 ship_type_destroyer_18_desc:0 "Orbital-linked destroyers receive fire-control quality data from sensors far beyond the fleet’s own horizon. They can launch interceptors against threats they have never directly observed and contribute their weapons to a planetary-scale defensive network."
 ship_type_destroyer_19:0 "Self-Sustaining Escort Destroyer"
 ship_type_destroyer_19_desc:0 "Automated repair shops, additive manufacturing, and closed-cycle stores let this escort stay with a fleet through campaigns that would exhaust ordinary logistics. Damage that once demanded a shipyard can be stabilized and partially rebuilt while underway."
 ship_type_destroyer_20:0 "Planetary Defense Destroyer"
 ship_type_destroyer_20_desc:0 "Planetary defense destroyers are the mobile surface layer of a global interception architecture. Their weapons are assigned by a network spanning oceans, atmosphere, and orbit, allowing dispersed escorts to combine fire as if they were a single enormous battery."
 ship_type_cruiser_11:0 "Autonomous Missile Cruiser"
 ship_type_cruiser_11_desc:0 "Autonomous battle management lets the missile cruiser coordinate dozens of simultaneous engagements across sea, air, and land. Its vertical cells carry a mixed arsenal chosen less for a single mission than for the ability to rewrite the task force’s fire plan while already in combat."
 ship_type_cruiser_12:0 "Hypersonic Arsenal Cruiser"
 ship_type_cruiser_12_desc:0 "The hypersonic arsenal cruiser exists to deliver overwhelming salvos at operational depth. Long-range boost weapons can reach fleets and land installations before slower forces close the distance, making the cruiser a mobile theater strike complex."
 ship_type_cruiser_13:0 "Uncrewed Arsenal Cruiser"
 ship_type_cruiser_13_desc:0 "An uncrewed arsenal cruiser replaces accommodation and survivability systems for sailors with magazines, power, armor, and machinery. It is a deliberately expendable concentration of firepower that can be sent into missile envelopes too dangerous for crewed capital ships."
 ship_type_cruiser_14:0 "Drone Carrier Cruiser"
 ship_type_cruiser_14_desc:0 "Drone carrier cruisers fill the space between escort and aircraft carrier. They launch large numbers of unmanned scouts, strike aircraft, surface craft, and antisubmarine vehicles, giving smaller task forces their own persistent robotic air and sea wing."
 ship_type_cruiser_15:0 "Directed-Energy Cruiser"
 ship_type_cruiser_15_desc:0 "Directed-energy cruisers carry the generators and thermal machinery needed to use lasers as primary fleet weapons rather than point defense. They can burn through sensors, thin-skinned craft, and incoming salvos while preserving missiles for targets that demand explosive force."
 ship_type_cruiser_16:0 "Fusion Battlecruiser"
 ship_type_cruiser_16_desc:0 "Fusion power restores the cruiser as a true fast capital combatant. High sustained speed, vast electrical generation, and long endurance allow it to operate independently across entire oceans while powering sensors and weapons that would overwhelm older propulsion plants."
 ship_type_cruiser_17:0 "Deep-Ocean Control Cruiser"
 ship_type_cruiser_17_desc:0 "Deep-ocean control cruisers command networks of surface, undersea, and airborne autonomous vehicles. Their mission is not simply to destroy ships but to occupy an enormous volume of ocean with sensors, patrol routes, mines, and remotely positioned weapons."
 ship_type_cruiser_18:0 "Orbital-Linked Cruiser"
 ship_type_cruiser_18_desc:0 "Orbital links place the cruiser inside a global sensor and targeting web. Fire-control solutions can arrive from satellites or distant fleets, while the ship’s own weapons can be assigned against targets far beyond its organic horizon."
 ship_type_cruiser_19:0 "Self-Sustaining Command Cruiser"
 ship_type_cruiser_19_desc:0 "A self-sustaining command cruiser carries fabrication halls, autonomous maintenance, expanded stores, and fleet coordination systems. It can serve as the logistical and command nucleus of a detached squadron operating far from permanent bases."
 ship_type_cruiser_20:0 "Planetary Control Cruiser"
 ship_type_cruiser_20_desc:0 "Planetary control cruisers act as mobile command citadels for oceanic warfare. Their sensors, drones, missiles, and communications coordinate operations across multiple seas, turning local naval groups into pieces of one integrated maritime battlespace."
 ship_type_battleship_11:0 "Autonomous Missile Battleship"
 ship_type_battleship_11_desc:0 "The autonomous missile battleship combines capital-ship protection with machine-managed magazines large enough to sustain repeated theater-scale salvos. Automation reduces the vulnerable human spaces inside the hull and allows weapons and damage control to dominate its internal design."
 ship_type_battleship_12:0 "Hypersonic Battleship"
 ship_type_battleship_12_desc:0 "Hypersonic batteries give the battleship striking reach measured across seas rather than gun horizons. Heavy armor and enormous magazines let it remain in contested waters while delivering weapons that arrive before distant targets can meaningfully reposition."
 ship_type_battleship_13:0 "Uncrewed Arsenal Battleship"
 ship_type_battleship_13_desc:0 "An uncrewed arsenal battleship is a fortress built around magazines, armor, reactors, and autonomous repair systems. Without a large crew to preserve, designers accept internal arrangements and combat risks that would be intolerable aboard a conventional capital ship."
 ship_type_battleship_14:0 "Drone Battleship"
 ship_type_battleship_14_desc:0 "Drone battleships carry vast complements of unmanned aircraft, surface craft, and underwater vehicles alongside their own heavy weapons. The hull becomes the armored center of a distributed combat cloud whose reach extends hundreds of kilometers in every direction."
 ship_type_battleship_15:0 "Directed-Energy Battleship"
 ship_type_battleship_15_desc:0 "Directed-energy batteries finally give the capital ship a weapon whose ammunition is measured in stored energy. Massive laser apertures and microwave arrays can defend the fleet, cripple exposed systems, and sustain fire until heat rejection becomes the limiting factor."
 ship_type_battleship_16:0 "Fusion Battleship"
 ship_type_battleship_16_desc:0 "Fusion propulsion supplies the power and endurance required for a modern battleship without binding it to vulnerable fuel logistics. Reactors feed propulsion, armor systems, sensors, fabrication machinery, and high-energy weapons simultaneously."
 ship_type_battleship_17:0 "Adaptive Armor Battleship"
 ship_type_battleship_17_desc:0 "Adaptive armor uses active materials, electromagnetic protection, and autonomous damage control to change how the hull meets an incoming attack. Protection is concentrated where sensors predict impact, while damaged sections isolate and reconfigure themselves around surviving systems."
 ship_type_battleship_18:0 "Orbital Fire-Control Battleship"
 ship_type_battleship_18_desc:0 "Orbital fire-control turns the battleship’s weapons into part of a much larger sensor architecture. It can engage targets hidden by the horizon, weather, or electronic deception using tracks maintained by platforms thousands of kilometers away."
 ship_type_battleship_19:0 "Self-Sustaining Dreadnought"
 ship_type_battleship_19_desc:0 "The self-sustaining dreadnought carries enough fabrication, repair, power, and stores to remain at sea through prolonged wars. It is designed as a mobile industrial fortress capable of replacing damaged systems and supporting smaller ships without a nearby naval base."
 ship_type_battleship_20:0 "Planetary Dominance Battleship"
 ship_type_battleship_20_desc:0 "Planetary dominance battleships are intended to impose sea control on the scale of hemispheres. Their armored hulls anchor networks of autonomous escorts and orbital sensors while vast magazines provide the sustained strike volume needed to dismantle an enemy’s maritime infrastructure."
 ship_type_aircraft_carrier_9:0 "Autonomous Supercarrier"
 ship_type_aircraft_carrier_9_desc:0 "Automation shifts much of the carrier’s workload from flight-deck crews to machines that fuel, arm, move, inspect, and launch aircraft. The result is a larger sortie rate with fewer people exposed on deck and much faster reconfiguration of the air wing."
 ship_type_aircraft_carrier_10:0 "Hypersonic Aviation Carrier"
 ship_type_aircraft_carrier_10_desc:0 "A hypersonic aviation carrier is built around aircraft and boost vehicles whose operating envelopes extend far beyond conventional naval aviation. Specialized launch, thermal, and maintenance systems let the carrier project force before an enemy fleet enters ordinary aircraft range."
 ship_type_aircraft_carrier_11:0 "Uncrewed Air Wing Carrier"
 ship_type_aircraft_carrier_11_desc:0 "An uncrewed air wing removes the cockpit as the limiting factor in carrier aviation. Aircraft can be smaller, endure higher acceleration, remain airborne longer, and accept missions whose loss rates would be politically impossible for a human air group."
 ship_type_aircraft_carrier_12:0 "Drone Supercarrier"
 ship_type_aircraft_carrier_12_desc:0 "The drone supercarrier launches not squadrons but ecosystems of specialized unmanned aircraft. Reconnaissance, jamming, interception, strike, tanker, decoy, and logistics drones cooperate continuously, allowing the air wing to rebuild its formation for each mission."
 ship_type_aircraft_carrier_13:0 "Directed-Energy Fleet Carrier"
 ship_type_aircraft_carrier_13_desc:0 "Directed-energy defenses protect the fleet carrier from the enormous missile and drone salvos aimed at its flight operations. High-power lasers also support the air wing by blinding sensors and clearing aerial threats around vulnerable launch and recovery corridors."
 ship_type_aircraft_carrier_14:0 "Fusion Supercarrier"
 ship_type_aircraft_carrier_14_desc:0 "Fusion power supports electromagnetic launch systems, high-energy defenses, fabrication facilities, and a permanently active sensor suite without forcing tradeoffs in propulsion endurance. The carrier can sustain intensive flight operations far from conventional fuel infrastructure."
 ship_type_aircraft_carrier_15:0 "Near-Space Aerospace Carrier"
 ship_type_aircraft_carrier_15_desc:0 "Near-space aerospace carriers operate craft that climb beyond normal aviation and return without the fixed infrastructure of a terrestrial spaceport. Their air wings can intercept boost vehicles, attack satellites in low orbit, and descend onto targets from trajectories traditional defenses were never built to cover."
 ship_type_aircraft_carrier_16:0 "Orbital-Linked Carrier"
 ship_type_aircraft_carrier_16_desc:0 "Orbital-linked carriers plan air operations with continuous tracks from space-based sensors and communications. Aircraft launch already knowing the location and predicted movement of targets far beyond the fleet horizon, while the carrier itself becomes a node in orbital defense and strike networks."
 ship_type_aircraft_carrier_17:0 "Self-Sustaining Oceanic Carrier"
 ship_type_aircraft_carrier_17_desc:0 "Self-sustaining oceanic carriers contain extensive fabrication, recycling, automated maintenance, and stores for very long deployments. Their air wings can be repaired and partially rebuilt at sea, reducing dependence on the handful of ports capable of servicing a capital aviation ship."
 ship_type_aircraft_carrier_18:0 "Planetary Aerospace Carrier"
 ship_type_aircraft_carrier_18_desc:0 "The planetary aerospace carrier coordinates aircraft, near-space craft, drones, and orbital assets as one integrated wing. From the ocean it can shape combat from sea level to low orbit, making the carrier less an airfield at sea than a mobile aerospace command complex."
 ship_type_modern_troop_ship_3:0 "Autonomous Strategic Sealift Ship"
 ship_type_modern_troop_ship_3_desc:0 "Autonomous cargo handling, robotic landing craft, and machine-managed stores let strategic sealift unload enormous forces with little prepared port infrastructure. Vehicles and supplies are sorted for combat before arrival, reducing the chaotic shore-side buildup that once slowed amphibious deployment."
 ship_type_modern_troop_ship_4:0 "Planetary Strategic Sealift Ship"
 ship_type_modern_troop_ship_4_desc:0 "Planetary strategic sealift is designed to move entire expeditionary systems rather than simply soldiers. Mobile factories, autonomous logistics, prefabricated bases, vehicles, and life-support stores travel as an integrated package so a force can establish itself on an austere coast almost immediately."
 mobilization_option_modern_autonomous_strategic_airlift:0 "Autonomous Strategic Airlift"
 mobilization_option_modern_near_space_airlift:0 "Near-Space Airlift"
 mobilization_option_modern_autonomous_recon:0 "Autonomous Reconnaissance Swarms"
 mobilization_option_modern_powered_infantry:0 "Powered Infantry Support"
