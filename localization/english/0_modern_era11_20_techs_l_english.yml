l_english:
 tech_agriculture_11:0 "Controlled-Environment Agriculture"
 tech_agriculture_11_desc:0 "Farms retreat from the weather behind controlled atmospheres, sensor-guided fertigation, and sealed growing halls. Agriculture becomes an industrial environment whose temperature, water, light, and nutrients can be scheduled with the same precision as a factory line."
 tech_agriculture_12:0 "Synthetic Soil Ecologies"
 tech_agriculture_12_desc:0 "Engineered substrates and managed soil microbiomes replace exhausted topsoil as the foundation of high-yield farming. Crops are fed by designed mineral cycles whose chemistry can be rebuilt instead of waiting for landscapes to recover."
 tech_agriculture_13:0 "Autonomous Biofarming"
 tech_agriculture_13_desc:0 "Autonomous field machines, robotic husbandry, and machine vision take over the continuous work of cultivation. Human labor shifts from tending individual plants to supervising agricultural systems that can sow, diagnose, harvest, and replant themselves."
 tech_agriculture_14:0 "Precision Microbiome Cultivation"
 tech_agriculture_14_desc:0 "Root-zone bacteria and fungi are deliberately selected, edited, and introduced to control nutrient uptake, disease resistance, and flavor. The living ecosystem beneath a crop becomes another programmable layer of production."
 tech_agriculture_15:0 "Closed-Loop Agroindustry"
 tech_agriculture_15_desc:0 "Water, nutrients, carbon, and organic waste circulate through enormous closed-loop agricultural complexes. Food production ceases to be merely rural land use and becomes a tightly integrated bioindustrial metabolism."
 tech_agriculture_16:0 "Climate-Independent Agriculture"
 tech_agriculture_16_desc:0 "Sealed agricultural environments decouple harvests from drought, storms, latitude, and seasonal failure. Regions once marginal for farming can maintain industrial-scale yields regardless of the climate outside."
 tech_agriculture_17:0 "Cellular Crop Engineering"
 tech_agriculture_17_desc:0 "Cellular engineering redesigns crop metabolism rather than merely selecting desirable traits. Plants grow faster, waste less energy, and synthesize useful fibers, oils, stimulants, and medicines as deliberately engineered products."
 tech_agriculture_18:0 "Self-Optimising Farm Ecologies"
 tech_agriculture_18_desc:0 "Continuous biological sensing allows farms to alter lighting, nutrients, planting density, and harvesting in response to each crop's condition. Entire agricultural ecologies learn to tune themselves over successive growing cycles."
 tech_agriculture_19:0 "Programmable Biosphere Agriculture"
 tech_agriculture_19_desc:0 "Programmable organisms blur the line between crop and machine: growth patterns, maturation, storage chemistry, and environmental response are specified before planting. Agriculture becomes the deliberate programming of living landscapes."
 tech_agriculture_20:0 "Planetary Food Fabrication"
 tech_agriculture_20_desc:0 "At planetary scale, food and biological feedstocks are fabricated through a mixture of engineered crops, cultured tissue, synthetic photosynthesis, and automated biosystems. Famine becomes less a limit of nature than a failure to deploy sufficient productive infrastructure."
 tech_air_infrastructure_11:0 "Adaptive Airspace Management"
 tech_air_infrastructure_11_desc:0 "Airspace becomes a continuously managed network rather than a collection of fixed corridors. Autonomous routing systems negotiate separation, weather, wake turbulence, and airport capacity in real time, allowing vastly denser skies without sacrificing safety."
 tech_air_infrastructure_12:0 "Morphing-Wing Airliners"
 tech_air_infrastructure_12_desc:0 "Active structures alter wing shape throughout a flight, eliminating many of the compromises between takeoff, cruise, and landing. Civil aircraft become quieter, more efficient, and capable of operating economically across a much wider range of routes."
 tech_air_infrastructure_13:0 "Stratospheric Transit Networks"
 tech_air_infrastructure_13_desc:0 "High-altitude aircraft and stratospheric transfer hubs create a new layer of transport above conventional aviation. Long-distance travel increasingly occurs where drag is thin, weather is distant, and continents are separated by hours rather than days."
 tech_air_infrastructure_14:0 "Autonomous Global Airlift"
 tech_air_infrastructure_14_desc:0 "Cargo fleets coordinate themselves from warehouse to runway to destination, dispatching aircraft around demand before shortages appear. Strategic airlift becomes a persistent logistics service rather than an emergency assembled after a crisis begins."
 tech_air_infrastructure_15:0 "Hypersonic Civil Aviation"
 tech_air_infrastructure_15_desc:0 "Commercial vehicles sustain hypersonic flight without destroying their own structures or making every journey economically absurd. Intercontinental passenger and freight movement enters an age where the curvature of the Earth becomes part of routine route planning."
 tech_air_infrastructure_16:0 "Atmospheric Traffic Orchestration"
 tech_air_infrastructure_16_desc:0 "Machine traffic controllers coordinate millions of piloted, autonomous, cargo, passenger, and service aircraft as one atmospheric system. Airports cease to be isolated bottlenecks and become nodes in a planetary flow of vehicles and capacity."
 tech_air_infrastructure_17:0 "Orbital-Linked Aviation"
 tech_air_infrastructure_17_desc:0 "Aviation networks synchronize with orbital navigation, communications, and logistics infrastructure. Aircraft can hand cargo and passengers into near-space transport chains whose scheduling spans runway, stratosphere, and orbit as a single timetable."
 tech_air_infrastructure_18:0 "Suborbital Passenger Flight"
 tech_air_infrastructure_18_desc:0 "Reusable suborbital craft turn brief excursions beyond the atmosphere into practical high-value transport. The fastest routes between distant cities rise above almost all of the air rather than trying to force their way through it."
 tech_air_infrastructure_19:0 "Near-Space Logistics"
 tech_air_infrastructure_19_desc:0 "Near-space freighters occupy the boundary between aircraft and spacecraft, loitering at extreme altitude before descending where demand requires them. Logistics networks gain a new reserve of mobile capacity that is global rather than regional."
 tech_air_infrastructure_20:0 "Fusion-Electric Aerospace Transport"
 tech_air_infrastructure_20_desc:0 "Compact fusion-electric power and mature aerospace materials support aircraft with extraordinary endurance and energy availability. Civil aerospace finally escapes the century-old dependence on burning immense masses of chemical fuel simply to remain aloft."
 tech_chemicals_11:0 "Molecular Consumer Materials"
 tech_chemicals_11_desc:0 "Consumer materials are designed molecule by molecule for strength, texture, recyclability, and controlled degradation. Furniture, food processing, textiles, and packaging increasingly begin in chemical design suites before they ever reach a production line."
 tech_chemicals_12:0 "Metamaterial Fabrication"
 tech_chemicals_12_desc:0 "Metamaterials obtain useful properties from engineered internal structure rather than chemical composition alone. Factories manufacture steels, ceramics, and composites whose response to stress, heat, radiation, and electromagnetic fields would once have appeared contradictory."
 tech_chemicals_13:0 "Programmable Polymers"
 tech_chemicals_13_desc:0 "Polymers can alter stiffness, permeability, conductivity, or shape in response to their environment. Plastics cease to be cheap inert substitutes and become active engineered materials used throughout infrastructure, electronics, medicine, and industry."
 tech_chemicals_14:0 "Molecular Electronics Chemistry"
 tech_chemicals_14_desc:0 "Chemical fabrication and electronics merge as circuits are deposited, grown, and assembled at molecular scales. Computing hardware increasingly depends on the chemistry of interfaces and self-organization rather than simply carving smaller features into silicon."
 tech_chemicals_15:0 "Regenerative Medicine"
 tech_chemicals_15_desc:0 "Advanced pharmaceuticals do more than suppress symptoms: engineered cells, molecular machines, and regenerative compounds restore damaged tissue and rewrite pathological processes. Medicine becomes an industry of repair rather than a contest against inevitable decline."
 tech_chemicals_16:0 "Atomic-Scale Manufacturing Chemistry"
 tech_chemicals_16_desc:0 "Manufacturing learns to place atoms and molecules with industrial reliability. Material purity, crystal structure, catalytic surfaces, and composite boundaries can be created deliberately instead of emerging imperfectly from bulk processing."
 tech_chemicals_17:0 "Self-Healing Structural Materials"
 tech_chemicals_17_desc:0 "Structures contain chemistries that close cracks, restore coatings, neutralize corrosion, and replace damaged bonds after stress. The useful life of buildings, vehicles, machines, and consumer goods becomes a property designed into the material itself."
 tech_chemicals_18:0 "Synthetic Molecular Ecologies"
 tech_chemicals_18_desc:0 "Engineered chemical and biological processes are arranged into synthetic ecologies in which the waste of one reaction becomes the feedstock of another. Large industrial complexes begin to imitate the closed material cycles of living systems."
 tech_chemicals_19:0 "Quantum Molecular Engineering"
 tech_chemicals_19_desc:0 "Quantum effects become practical variables in molecular design, enabling catalysts and materials optimized through direct control of electronic states. Chemical engineering advances from manipulating substances to manipulating the rules by which substances interact."
 tech_chemicals_20:0 "Universal Materials Synthesis"
 tech_chemicals_20_desc:0 "General-purpose synthesis platforms can construct an enormous range of materials from common molecular feedstocks. Specialized supply chains do not disappear, but an increasing share of industrial scarcity becomes a question of energy, information, and fabrication capacity."
 tech_communication_infrastructure_11:0 "Terabit Mesh Networks"
 tech_communication_infrastructure_11_desc:0 "Self-routing terabit meshes make enormous bandwidth ordinary even far from traditional backbone infrastructure. Networks continuously rebuild around congestion and damage, treating every terminal, vehicle, and building as a potential relay."
 tech_communication_infrastructure_12:0 "Photonic Communications"
 tech_communication_infrastructure_12_desc:0 "Photonic switching moves data without repeatedly converting light into electrical signals. Vast volumes of information cross cities and continents with far lower latency and heat, turning the network itself into something closer to an optical machine."
 tech_communication_infrastructure_13:0 "Ambient Network Computing"
 tech_communication_infrastructure_13_desc:0 "Computation and connectivity fade into the environment as buildings, streets, appliances, and vehicles participate automatically in shared information spaces. 'Going online' becomes an anachronism in a world where the physical environment is already networked."
 tech_communication_infrastructure_14:0 "Neural Interface Networks"
 tech_communication_infrastructure_14_desc:0 "Neural interfaces add human sensory and cognitive systems directly to communications networks. Information can be exchanged as richer streams of intention, sensation, and structured thought rather than being reduced to screens, keyboards, and speech."
 tech_communication_infrastructure_15:0 "Planetary Quantum Networking"
 tech_communication_infrastructure_15_desc:0 "Quantum repeaters, conventional photonics, and autonomous routing combine into networks that span the planet with extremely strong security and precise synchronization. Critical communications cease to depend on a few vulnerable trunks and terrestrial chokepoints."
 tech_communication_infrastructure_16:0 "Holographic Telepresence"
 tech_communication_infrastructure_16_desc:0 "Volumetric capture and display make remote presence spatial, persistent, and socially convincing. Meetings, medical consultations, training, entertainment, and commerce can occupy a shared room even when the participants are separated by oceans."
 tech_communication_infrastructure_17:0 "Autonomous Knowledge Networks"
 tech_communication_infrastructure_17_desc:0 "Networks no longer merely carry information; autonomous agents curate, negotiate, translate, and act upon it. Institutions begin communicating through machine representatives operating continuously at speeds no human bureaucracy could sustain."
 tech_communication_infrastructure_18:0 "Entanglement-Secured Communications"
 tech_communication_infrastructure_18_desc:0 "Entanglement-assisted security and quantum key infrastructure make interception detectable and high-value communications extraordinarily difficult to compromise. States and corporations rebuild their most sensitive command networks around trust rooted in physics rather than secrecy alone."
 tech_communication_infrastructure_19:0 "Interplanetary Communications Architecture"
 tech_communication_infrastructure_19_desc:0 "Delay-tolerant protocols, orbital relays, and autonomous routing extend the information economy across the inner Solar System. Networks learn to remain coherent when a message may need minutes, not milliseconds, to reach the other side."
 tech_communication_infrastructure_20:0 "Ubiquitous Cognitive Network"
 tech_communication_infrastructure_20_desc:0 "Connectivity becomes a cognitive utility woven through people, machines, institutions, and infrastructure. Information moves to where it is needed before users explicitly request it, and the distinction between communications network and distributed intelligence begins to disappear."
 tech_construction_infrastructure_11:0 "Autonomous Construction Fleets"
 tech_construction_infrastructure_11_desc:0 "Autonomous earthmovers, cranes, haulers, and survey systems coordinate entire worksites with minimal direct supervision. Construction capacity becomes less dependent on assembling immense temporary workforces for every new project."
 tech_construction_infrastructure_12:0 "Self-Sensing Structures"
 tech_construction_infrastructure_12_desc:0 "Structures are filled with sensors that track load, fatigue, corrosion, moisture, and microscopic movement throughout their lives. Engineers can reinforce a bridge or tower because it reports what is failing, rather than after damage becomes visible."
 tech_construction_infrastructure_13:0 "Robotic Prefabrication Yards"
 tech_construction_infrastructure_13_desc:0 "Standardized robotic yards fabricate complete structural modules, service cores, and fitted rooms before they ever reach the site. Building becomes a logistics problem of assembling finished systems rather than improvising every wall in place."
 tech_construction_infrastructure_14:0 "Additive Megastructure Fabrication"
 tech_construction_infrastructure_14_desc:0 "Large-format additive fabrication produces structural members and entire shells directly from digital designs. Curves, internal lattices, and optimized geometries that were once prohibitively expensive become ordinary features of megaprojects."
 tech_construction_infrastructure_15:0 "Self-Healing Concrete Systems"
 tech_construction_infrastructure_15_desc:0 "Concrete and composite structures incorporate agents that seal fractures and restore damaged matrices as they form. Maintenance becomes partly continuous and automatic, allowing enormous built environments to age without decaying at twentieth-century rates."
 tech_construction_infrastructure_16:0 "Metamaterial Structural Engineering"
 tech_construction_infrastructure_16_desc:0 "Engineered lattices and metamaterial structures achieve extraordinary strength-to-weight ratios and control vibration, heat, and sound. Architecture can span farther and rise higher without merely multiplying the mass of conventional steel and concrete."
 tech_construction_infrastructure_17:0 "Autonomous Urban Fabrication"
 tech_construction_infrastructure_17_desc:0 "Construction fleets are dispatched as autonomous urban utilities, constantly replacing utilities, extending buildings, repairing streets, and preparing sites. Cities acquire the ability to rebuild themselves without enduring decades of sequential public works."
 tech_construction_infrastructure_18:0 "Programmable Structural Matter"
 tech_construction_infrastructure_18_desc:0 "Structural matter can change stiffness, geometry, or internal configuration after installation. Buildings and infrastructure become adaptable machines, able to alter spaces and load paths as their use changes instead of being demolished and rebuilt."
 tech_construction_infrastructure_19:0 "Continental-Scale Construction Logistics"
 tech_construction_infrastructure_19_desc:0 "Continental project networks coordinate quarries, factories, fabrication yards, transport corridors, and robotic worksites as one construction system. Megaprojects are limited increasingly by political commitment and resources rather than coordination overhead."
 tech_construction_infrastructure_20:0 "Self-Assembling Megastructures"
 tech_construction_infrastructure_20_desc:0 "Self-assembling structural systems combine robotic modules, programmable joints, and autonomous fabrication into megastructures that grow in place. The scale of feasible construction expands from individual towers and dams toward whole districts, habitats, and engineered landscapes."
 tech_economy_11:0 "Algorithmic Market Governance"
 tech_economy_11_desc:0 "Governments and exchanges monitor supply, demand, credit, inventories, and production nearly as they occur, allowing regulation to respond to emerging instability instead of statistics published months later. Markets remain decentralized, but their governing institutions become relentlessly data-driven."
 tech_economy_12:0 "Real-Time Macroeconomics"
 tech_economy_12_desc:0 "Macroeconomic measurement approaches real time as transactions, logistics, energy use, employment, and inventories feed continuously into national models. Recessions and shortages become observable processes rather than mysteries reconstructed after the fact."
 tech_economy_13:0 "Machine-Mediated Capital Allocation"
 tech_economy_13_desc:0 "Machine systems evaluate risk, productive capacity, and expected return across economies too complex for traditional investment committees to survey. Capital moves faster toward emerging opportunities—and mistakes can spread just as quickly when models share the same blind spots."
 tech_economy_14:0 "Planetary Clearing Networks"
 tech_economy_14_desc:0 "Continuous global settlement networks reduce the friction between currencies, banks, markets, and jurisdictions. Large transfers that once required layers of intermediaries become routine machine-to-machine accounting across planetary commerce."
 tech_economy_15:0 "Autonomous Corporate Governance"
 tech_economy_15_desc:0 "Corporations delegate procurement, treasury, scheduling, compliance, and portions of strategic planning to autonomous agents operating under human-defined constraints. The firm begins to resemble a continuously optimizing institution rather than a hierarchy that meets periodically to make decisions."
 tech_economy_16:0 "Synthetic Market Institutions"
 tech_economy_16_desc:0 "New legal and economic institutions are designed around automated contracts, machine agents, shared ownership structures, and resources that can be allocated at computational speed. Economic organization expands beyond the assumptions inherited from industrial capitalism."
 tech_economy_17:0 "Predictive Political Economy"
 tech_economy_17_desc:0 "Large-scale forecasting systems integrate climate, demographics, production, finance, and political behavior into policy simulations. Economic debate does not vanish, but decision-makers can test consequences against models of unprecedented detail before committing entire societies."
 tech_economy_18:0 "Post-Scarcity Allocation Theory"
 tech_economy_18_desc:0 "When many essential goods become extremely cheap to produce, economics shifts toward managing energy, land, rare materials, attention, access, and institutional power. Theories built around generalized material scarcity begin to lose explanatory force."
 tech_economy_19:0 "Interplanetary Political Economy"
 tech_economy_19_desc:0 "Permanent off-world settlements create markets with communication delays, immense transport costs, unusual property regimes, and resources unavailable on Earth. Political economy becomes genuinely interplanetary rather than merely global."
 tech_economy_20:0 "Abundance Economics"
 tech_economy_20_desc:0 "Mature automation and fabrication make broad classes of material goods abundant relative to human demand. The central economic problems move from producing enough objects toward distributing capacity, status, experiences, scarce locations, and control over civilization-scale systems."
 tech_electronics_11:0 "Neuromorphic Computing"
 tech_electronics_11_desc:0 "Neuromorphic processors imitate the event-driven architecture of nervous systems, performing perception and pattern recognition with a fraction of the energy of conventional hardware. Intelligent machines become easier to distribute throughout ordinary infrastructure."
 tech_electronics_12:0 "Photonic Logic"
 tech_electronics_12_desc:0 "Optical logic replaces electrons with photons in an expanding share of computation and switching. Data moves through processors at enormous speed while escaping some of the heat and resistance that constrained the late semiconductor age."
 tech_electronics_13:0 "Molecular-Scale Electronics"
 tech_electronics_13_desc:0 "Electronic components are assembled from molecular-scale structures whose behavior is engineered at the level of individual bonds. Devices become smaller not because fabrication merely improves, but because the component itself is redefined."
 tech_electronics_14:0 "Reversible Computing"
 tech_electronics_14_desc:0 "Reversible circuits recover information that conventional logic would discard as heat. Computing efficiency begins to approach physical limits that once seemed relevant only to theorists, making immense computational loads practical without equally immense power plants."
 tech_electronics_15:0 "Synthetic Cognition Hardware"
 tech_electronics_15_desc:0 "Specialized hardware is built expressly for synthetic minds, combining dense memory, inference engines, sensory integration, and adaptive interconnects. Artificial cognition no longer has to inhabit machines designed primarily for arithmetic and office software."
 tech_electronics_16:0 "Distributed Machine Intelligence"
 tech_electronics_16_desc:0 "Machine intelligence is distributed across factories, homes, vehicles, public infrastructure, and networks rather than concentrated in isolated data centers. Intelligence becomes a property of systems composed of many cooperating machines."
 tech_electronics_17:0 "Biological-Digital Convergence"
 tech_electronics_17_desc:0 "Living tissue and electronics communicate through stable engineered interfaces, allowing sensors, processors, and biological systems to share signals directly. Medical devices, research instruments, and computers begin to occupy the same physical substrate."
 tech_electronics_18:0 "Quantum-Neural Architectures"
 tech_electronics_18_desc:0 "Quantum accelerators and neural architectures are coupled into hybrid systems, each handling the classes of problems to which it is best suited. Optimization, simulation, learning, and control increasingly occur inside heterogeneous cognitive machines."
 tech_electronics_19:0 "Matter-Embedded Computation"
 tech_electronics_19_desc:0 "Computation is embedded directly into structural materials, clothing, tools, and manufactured objects. Instead of attaching a computer to a product, industry manufactures products whose matter itself can sense, calculate, communicate, and respond."
 tech_electronics_20:0 "Substrate-Independent Computing"
 tech_electronics_20_desc:0 "The same cognitive processes can be instantiated across radically different hardware—electronic, photonic, quantum, biological, or hybrid. Intelligence becomes less tied to a particular machine architecture and more like software capable of migrating between physical substrates."
 tech_energy_infrastructure_11:0 "Commercial Fusion Grids"
 tech_energy_infrastructure_11_desc:0 "Fusion plants leave the demonstration stage and become repeatable pieces of national infrastructure. Utilities learn to build, fuel, maintain, and connect reactors in numbers large enough for fusion to shape the energy market rather than merely symbolize scientific prestige."
 tech_energy_infrastructure_12:0 "Superconducting Power Networks"
 tech_energy_infrastructure_12_desc:0 "Near-lossless transmission and superconducting machinery allow power to move between regions with far less waste. Continental grids can share immense peaks in generation and demand without building duplicate reserve capacity everywhere."
 tech_energy_infrastructure_13:0 "Advanced Stellarator Systems"
 tech_energy_infrastructure_13_desc:0 "Improved confinement, materials, and maintenance systems make advanced stellarators practical for continuous operation. Fusion power becomes less dependent on short pulses and increasingly resembles the reliable baseload plants that electrical systems know how to use."
 tech_energy_infrastructure_14:0 "Space-Based Solar Power"
 tech_energy_infrastructure_14_desc:0 "Orbital collectors harvest sunlight without night, weather, or atmospheric loss and beam power to receiving stations below. The energy system acquires generating territory measured in orbital slots rather than square kilometers of land."
 tech_energy_infrastructure_15:0 "Aneutronic Fusion"
 tech_energy_infrastructure_15_desc:0 "Aneutronic reactions reduce the neutron bombardment that makes conventional fusion reactors difficult to maintain and allows more direct conversion of fusion energy into electricity. Power plants become cleaner, longer-lived, and potentially far more compact."
 tech_energy_infrastructure_16:0 "Planetary Energy Storage"
 tech_energy_infrastructure_16_desc:0 "Planetary storage systems absorb fluctuations measured in cities and seasons, using chemical, thermal, mechanical, and superconducting reservoirs under coordinated control. Variable generation stops being a local balancing problem and becomes a managed property of the grid."
 tech_energy_infrastructure_17:0 "Helium-3 Fusion Economy"
 tech_energy_infrastructure_17_desc:0 "Regular access to extraterrestrial helium-3 opens fuel cycles previously limited by terrestrial scarcity. Fusion economics begins to connect mines, launch systems, lunar industry, and electrical grids into a single strategic supply chain."
 tech_energy_infrastructure_18:0 "Deep-Geothermal Planetary Tapping"
 tech_energy_infrastructure_18_desc:0 "Ultra-deep drilling and high-temperature materials reach heat reservoirs once considered inaccessible. Geothermal generation expands beyond favorable geology toward something that can be engineered almost anywhere with sufficient capital."
 tech_energy_infrastructure_19:0 "Artificial Photosynthetic Power"
 tech_energy_infrastructure_19_desc:0 "Engineered photochemical systems turn sunlight directly into storable fuels and electrical intermediates with efficiencies far beyond natural photosynthesis. Surfaces throughout the built environment can become quiet chemical power plants."
 tech_energy_infrastructure_20:0 "Controlled Microstar Power"
 tech_energy_infrastructure_20_desc:0 "Controlled fusion plasmas reach power densities that justify the old metaphor of a star in a bottle. Compact 'microstar' reactors supply immense, steady energy to cities, industry, spacecraft, and megastructures with fuel requirements almost trivial beside their output."
 tech_geopolitics_11:0 "Networked Sovereignty"
 tech_geopolitics_11_desc:0 "Sovereignty is exercised through dense networks of trade, data, finance, security guarantees, standards, and shared infrastructure rather than territorial control alone. States learn to wield influence inside systems they do not directly own."
 tech_geopolitics_12:0 "Planetary Treaty Systems"
 tech_geopolitics_12_desc:0 "Treaty organizations acquire permanent technical institutions capable of managing climate, health, migration, orbital traffic, and strategic stability across nearly every major power. Diplomacy increasingly builds machinery meant to operate continuously between summits."
 tech_geopolitics_13:0 "Climate Governance Regimes"
 tech_geopolitics_13_desc:0 "Climate adaptation, carbon management, water sharing, migration, and disaster response become central questions of international order. Environmental policy evolves into a field of high politics comparable to trade or collective security."
 tech_geopolitics_14:0 "Supranational Security Architecture"
 tech_geopolitics_14_desc:0 "Regional alliances coordinate intelligence, logistics, industrial policy, cyber defense, and strategic forces deeply enough to act as security architectures rather than temporary coalitions. The line between national defense and supranational defense grows increasingly thin."
 tech_geopolitics_15:0 "Continental Federations"
 tech_geopolitics_15_desc:0 "Some regional unions accumulate enough common law, fiscal capacity, infrastructure, and foreign policy to operate as continental political actors. Member states preserve identity while pooling powers once treated as indivisible attributes of sovereignty."
 tech_geopolitics_16:0 "Transnational Citizenship"
 tech_geopolitics_16_desc:0 "Long-term residence, digital identity, labor mobility, and overlapping jurisdictions weaken the assumption that political membership must be exclusive. Citizenship becomes layered across municipal, national, regional, and transnational institutions."
 tech_geopolitics_17:0 "Planetary Resource Compacts"
 tech_geopolitics_17_desc:0 "States establish durable regimes for scarce minerals, oceans, climate systems, orbital slots, and other resources whose exploitation can destabilize everyone if left purely to unilateral competition."
 tech_geopolitics_18:0 "Orbital Sovereignty Law"
 tech_geopolitics_18_desc:0 "Permanent orbital industry forces international law to define property, military exclusion, salvage, traffic, liability, and jurisdiction beyond the atmosphere. Space stops being a legal exception and becomes a governed strategic domain."
 tech_geopolitics_19:0 "Interplanetary Diplomacy"
 tech_geopolitics_19_desc:0 "Permanent settlements beyond Earth create political actors whose interests cannot be reduced to those of their founding states. Diplomacy must function across communication delay, different environments, and communities separated by millions of kilometers."
 tech_geopolitics_20:0 "Civilizational Governance"
 tech_geopolitics_20_desc:0 "Political order expands to the scale of a technological civilization spanning Earth and off-world settlements. Geopolitics no longer disappears; it becomes the problem of coordinating power among institutions whose actions can affect an entire civilization."
 tech_land_infrastructure_11:0 "Autonomous Freight Corridors"
 tech_land_infrastructure_11_desc:0 "Road freight becomes a coordinated autonomous service in which vehicles, depots, and loading systems schedule themselves continuously. Corridors carry more goods not simply because they are wider, but because wasted space and idle time are engineered out."
 tech_land_infrastructure_12:0 "Maglev Freight Networks"
 tech_land_infrastructure_12_desc:0 "High-capacity magnetic-levitation freight trains move containers between industrial regions at airline-like speeds while retaining rail's efficiency. Inland logistics begins to operate on timetables once reserved for perishable air cargo."
 tech_land_infrastructure_13:0 "Dynamic Road Surfaces"
 tech_land_infrastructure_13_desc:0 "Road surfaces monitor damage, communicate hazards, control lane allocation, and alter traction or charging behavior to match traffic. The roadway itself becomes an active participant in transport rather than passive pavement."
 tech_land_infrastructure_14:0 "Vacuum Transit"
 tech_land_infrastructure_14_desc:0 "Low-pressure tubes and vacuum corridors allow terrestrial vehicles to travel at extreme speed with minimal aerodynamic loss. Major cities become linked by infrastructure whose travel times compete with suborbital flight without ever leaving the ground."
 tech_land_infrastructure_15:0 "Planetary Logistics Mesh"
 tech_land_infrastructure_15_desc:0 "Freight, passengers, utilities, warehouses, railways, roads, and autonomous vehicles are coordinated as one planetary logistics mesh. Capacity can be reassigned across modes before congestion becomes visible to individual operators."
 tech_land_infrastructure_16:0 "Self-Repairing Infrastructure"
 tech_land_infrastructure_16_desc:0 "Robotic inspection and embedded repair systems turn maintenance from periodic reconstruction into continuous intervention. Infrastructure can survive decades of heavy use without accumulating the hidden deterioration that once produced sudden failures."
 tech_land_infrastructure_17:0 "AI-Orchestrated Mobility"
 tech_land_infrastructure_17_desc:0 "Artificial intelligence orchestrates public and private mobility across an entire economy, routing people and cargo according to capacity, urgency, energy cost, and downstream demand. Transport becomes a continuously optimized flow rather than a collection of independent journeys."
 tech_land_infrastructure_18:0 "Continental Vacuum Rail"
 tech_land_infrastructure_18_desc:0 "Vacuum rail corridors span continents, linking major population and production centers through sealed high-speed networks. Geography still matters, but the practical distance between inland regions collapses."
 tech_land_infrastructure_19:0 "Adaptive Megainfrastructure"
 tech_land_infrastructure_19_desc:0 "Bridges, tunnels, roads, railways, utilities, and stations alter capacity and configuration in response to changing demand. Megainfrastructure becomes adaptive, allowing the built network to evolve without generations of demolition and replacement."
 tech_land_infrastructure_20:0 "Integrated Planetary Transit"
 tech_land_infrastructure_20_desc:0 "Every major terrestrial transport mode is integrated into a shared scheduling and capacity system. Goods can cross a continent through road, rail, vacuum corridor, and local autonomous delivery without any participant treating those transfers as separate industries."
 tech_manufacturing_11:0 "Lights-Out Megafactories"
 tech_manufacturing_11_desc:0 "Factories operate for long periods without people on the production floor, with robots handling materials, inspection, tool changes, and internal logistics. Human work moves toward engineering, supervision, design, and exceptional maintenance."
 tech_manufacturing_12:0 "Adaptive Robotic Production"
 tech_manufacturing_12_desc:0 "Robotic lines reconfigure themselves for new products instead of being rebuilt around every model change. Manufacturing plants can shift output quickly enough for industrial capacity to follow demand rather than lag years behind it."
 tech_manufacturing_13:0 "Additive Industrial Fabrication"
 tech_manufacturing_13_desc:0 "Additive systems manufacture finished industrial components with complex internal structures that machining could never produce economically. Tooling matters less, while digital designs become an increasingly direct input into physical production."
 tech_manufacturing_14:0 "Molecular Assembly Lines"
 tech_manufacturing_14_desc:0 "Molecularly precise processes begin to assemble critical components at scales where conventional cutting, casting, and deposition are too crude. The factory floor expands downward into the structure of matter itself."
 tech_manufacturing_15:0 "Self-Reconfiguring Factories"
 tech_manufacturing_15_desc:0 "Machines, work cells, and material flows reorganize automatically when products, demand, or equipment availability change. A factory becomes less a fixed arrangement of lines than a physical system that continuously rewrites its own layout."
 tech_manufacturing_16:0 "Bioindustrial Manufacturing"
 tech_manufacturing_16_desc:0 "Engineered organisms manufacture chemicals, fibers, composites, pharmaceuticals, and specialized feedstocks alongside mechanical production. Industrial biotechnology moves from niche fermentation into the core of the manufacturing economy."
 tech_manufacturing_17:0 "Autonomous Industrial Ecosystems"
 tech_manufacturing_17_desc:0 "Factories negotiate orders, energy, maintenance, inventories, and logistics with other factories without waiting for human scheduling. Industrial regions begin behaving like autonomous productive ecosystems rather than collections of separate firms."
 tech_manufacturing_18:0 "Programmable Matter Production"
 tech_manufacturing_18_desc:0 "Programmable matter allows components to acquire form and function late in the production process. Inventory can be held as versatile feedstock whose final geometry is decided only when demand is known."
 tech_manufacturing_19:0 "Distributed Megafabrication"
 tech_manufacturing_19_desc:0 "Networks of compact advanced factories distribute sophisticated production across many locations while sharing designs and capacity. Industrial resilience comes from replication and coordination instead of concentrating every critical process in a handful of giant plants."
 tech_manufacturing_20:0 "Universal Fabrication Systems"
 tech_manufacturing_20_desc:0 "General-purpose fabrication systems can transform common feedstocks into an enormous range of finished industrial goods. Manufacturing approaches the long-promised ideal in which information specifies the product and machinery supplies the universal means of making it."
 tech_military_airforce_11:0 "Adaptive Air Superiority"
 tech_military_airforce_11_desc:0 "Adaptive flight controls, sensor fusion, and networked weapons allow combat aircraft to alter tactics faster than human staffs can issue new doctrine. Air superiority becomes a contest between systems that continuously learn the geometry of the battlespace."
 tech_military_airforce_12:0 "Hypersonic Air Warfare"
 tech_military_airforce_12_desc:0 "Hypersonic combat aircraft compress warning times to minutes and can strike or reposition across theater distances before conventional defenses can react. Air warfare begins to resemble guided orbital mechanics conducted inside the atmosphere."
 tech_military_airforce_13:0 "Autonomous Combat Aviation"
 tech_military_airforce_13_desc:0 "Uncrewed combat aircraft become capable of carrying out complex air-to-air and strike missions without remote pilots micromanaging every maneuver. Human commanders specify objectives while machines conduct much of the actual fight."
 tech_military_airforce_14:0 "Loyal-Wingman Swarms"
 tech_military_airforce_14_desc:0 "Manned command aircraft operate with swarms of cheaper autonomous wingmen that scout, jam, decoy, intercept, and attack as a coordinated pack. The tactical unit is no longer a single aircraft but a distributed airborne system."
 tech_military_airforce_15:0 "Directed-Energy Air Combat"
 tech_military_airforce_15_desc:0 "Compact directed-energy weapons give aircraft magazines limited more by power and heat than by missile count. Interception, point defense, and close-range combat increasingly reward electrical generation and thermal management."
 tech_military_airforce_16:0 "Stratospheric Air Dominance"
 tech_military_airforce_16_desc:0 "Combat aircraft exploit the thin air of the stratosphere for speed, range, and sensor coverage, forcing air-defense networks to guard a battlespace extending far above traditional aviation altitudes."
 tech_military_airforce_17:0 "Near-Space Interception"
 tech_military_airforce_17_desc:0 "Aircraft able to operate at the edge of space can threaten both atmospheric and low-orbit targets. Air defense and space defense begin to merge as the same interceptor may fight on either side of the conventional boundary."
 tech_military_airforce_18:0 "Fusion-Powered Combat Aviation"
 tech_military_airforce_18_desc:0 "Fusion power gives military aerospace vehicles enormous electrical reserves and endurance, supporting high-energy sensors, directed weapons, and sustained high-speed operation without the fuel burden of chemical aviation."
 tech_military_airforce_19:0 "Orbital-Atmospheric Warfare"
 tech_military_airforce_19_desc:0 "Military aerospace doctrine integrates aircraft, reusable orbital vehicles, satellites, and near-space platforms into one battlespace. A strike can descend from orbit, climb from the atmosphere, or transition between the two during the same operation."
 tech_military_airforce_20:0 "Autonomous Aerospace Supremacy"
 tech_military_airforce_20_desc:0 "Autonomous aerospace platforms coordinate interception, strike, electronic warfare, and reconnaissance at machine speed across planetary distances. Human command remains strategic; tactical air combat becomes overwhelmingly computational."
 tech_military_ground_forces_11:0 "Integrated Battlefield Networks"
 tech_military_ground_forces_11_desc:0 "Every squad, vehicle, drone, sensor, and support weapon participates in a shared battlefield network. Infantry fight with a continuously updated picture of threats and friendly forces rather than isolated reports passed up and down a chain of command."
 tech_military_ground_forces_12:0 "Powered Infantry"
 tech_military_ground_forces_12_desc:0 "Powered exoskeletons let infantry carry heavier armor, sensors, weapons, and supplies without sacrificing mobility. The individual soldier becomes a platform capable of sustaining loads once reserved for vehicles."
 tech_military_ground_forces_13:0 "Autonomous Ground Combat"
 tech_military_ground_forces_13_desc:0 "Autonomous vehicles and robotic combat systems move from support roles into the center of maneuver warfare. Human troops increasingly direct formations in which many of the platforms taking fire contain no crew at all."
 tech_military_ground_forces_14:0 "Drone-Saturated Warfare"
 tech_military_ground_forces_14_desc:0 "Cheap reconnaissance and attack drones saturate the battlespace from treetop height to the tactical rear. Concealment, movement, logistics, and air defense must all adapt to the assumption that observation is persistent and expendable."
 tech_military_ground_forces_15:0 "Directed-Energy Ground Weapons"
 tech_military_ground_forces_15_desc:0 "Portable high-energy weapons provide infantry and vehicles with rapid, precise fire against drones, sensors, light vehicles, and exposed positions. Power generation and cooling become as important to combat endurance as ammunition supply."
 tech_military_ground_forces_16:0 "Adaptive Combat Armor"
 tech_military_ground_forces_16_desc:0 "Armor incorporates active protection, adaptive materials, multispectral camouflage, and automated damage control. Survivability depends less on adding passive mass and more on defeating an attack before or as it reaches the vehicle."
 tech_military_ground_forces_17:0 "Cognitive Battlefield Systems"
 tech_military_ground_forces_17_desc:0 "Machine assistants fuse sensor data, predict enemy action, allocate fires, and warn soldiers before threats are consciously understood. The battlefield becomes cognitively manageable only because software filters an otherwise impossible volume of information."
 tech_military_ground_forces_18:0 "Self-Sustaining Expeditionary Warfare"
 tech_military_ground_forces_18_desc:0 "Advanced logistics, fabrication, medicine, and energy systems let expeditionary forces sustain themselves for far longer with fewer vulnerable supply convoys. Operational reach grows as armies carry productive capacity with them."
 tech_military_ground_forces_19:0 "Synthetic Combined Arms"
 tech_military_ground_forces_19_desc:0 "Biological troops, autonomous machines, drones, armor, fires, and synthetic decision systems are organized as a single combined-arms organism. The distinction between branch, platform, and weapon becomes less important than how the whole system behaves."
 tech_military_ground_forces_20:0 "Post-Human Ground Warfare"
 tech_military_ground_forces_20_desc:0 "Enhanced soldiers and autonomous systems operate together at reaction speeds and endurance beyond unaugmented human limits. Ground warfare reaches a point where the definition of 'infantry' describes a battlefield function more than a purely biological person."
 tech_military_naval_forces_11:0 "Autonomous Blue-Water Fleets"
 tech_military_naval_forces_11_desc:0 "Surface ships, submarines, aircraft, and uncrewed vessels coordinate as distributed fleets rather than relying on a few crewed flagships. Naval power becomes harder to destroy because sensing and firepower are dispersed across the ocean."
 tech_military_naval_forces_12:0 "Hypersonic Naval Warfare"
 tech_military_naval_forces_12_desc:0 "Hypersonic weapons give ships the ability to strike moving targets across enormous distances with extremely short warning. Naval defense must detect and decide faster than any twentieth-century command structure was built to manage."
 tech_military_naval_forces_13:0 "Uncrewed Surface Combatants"
 tech_military_naval_forces_13_desc:0 "Large uncrewed combatants carry missiles, sensors, decoys, and drones into dangerous waters without risking hundreds of sailors. Fleet mass can grow without proportionally growing manpower or political sensitivity to losses."
 tech_military_naval_forces_14:0 "Drone Carrier Fleets"
 tech_military_naval_forces_14_desc:0 "Carriers evolve from airports at sea into mobile command nodes for enormous swarms of autonomous aircraft and surface vehicles. The air wing becomes more numerous, expendable, and persistent than any crewed force could be."
 tech_military_naval_forces_15:0 "Directed-Energy Warships"
 tech_military_naval_forces_15_desc:0 "High-energy lasers and electromagnetic weapons transform point defense and surface combat. Ships become electrical weapons platforms whose combat endurance increasingly depends on reactors, capacitors, and cooling systems."
 tech_military_naval_forces_16:0 "Fusion Naval Propulsion"
 tech_military_naval_forces_16_desc:0 "Fusion propulsion frees major warships from much of the fuel logistics that once constrained deployment. Fleets can remain on station for extraordinary periods while powering sensors and weapons far beyond the capacity of conventional engines."
 tech_military_naval_forces_17:0 "Deep-Ocean Stealth Warfare"
 tech_military_naval_forces_17_desc:0 "Advanced coatings, quiet propulsion, distributed sensors, and autonomous navigation push naval competition deeper below the surface. Submarines and unmanned undersea systems contest parts of the ocean that surface fleets can scarcely observe."
 tech_military_naval_forces_18:0 "Near-Space Naval Integration"
 tech_military_naval_forces_18_desc:0 "Naval forces integrate near-space sensors, interceptors, and communications directly into fleet operations. The horizon of a warship expands from the curvature of the Earth to the orbital infrastructure above it."
 tech_military_naval_forces_19:0 "Self-Sustaining Oceanic Fleets"
 tech_military_naval_forces_19_desc:0 "Automated maintenance, fabrication, food systems, and logistics allow fleets to remain at sea for months or years with minimal port support. Oceanic presence becomes persistent rather than a sequence of deployments between shore bases."
 tech_military_naval_forces_20:0 "Planetary Maritime Dominance"
 tech_military_naval_forces_20_desc:0 "Mature autonomous fleets combine deep-ocean systems, aerospace assets, directed energy, and enormous endurance into a planetary maritime network. Command of the sea means controlling the entire oceanic information and logistics environment, not merely defeating enemy ships in battle."
 tech_military_navy_doctrine_11:0 "Distributed Maritime Operations"
 tech_military_navy_doctrine_11_desc:0 "Fleets disperse sensors and weapons across many platforms while remaining connected strongly enough to fight as one force. Concentration of effect replaces concentration of hulls."
 tech_military_navy_doctrine_12:0 "Autonomous Fleet Command"
 tech_military_navy_doctrine_12_desc:0 "Machine commanders handle routing, formation geometry, threat assignment, and local engagements at speeds impossible for a human bridge team. Admirals increasingly command objectives and risk rather than individual maneuvers."
 tech_military_navy_doctrine_13:0 "Machine-Speed Sea Control"
 tech_military_navy_doctrine_13_desc:0 "Automated sensor fusion and weapons coordination shorten the naval decision cycle to seconds. Victory depends on whose network can identify, classify, and engage first without collapsing into friendly fire or false targets."
 tech_military_navy_doctrine_14:0 "Deep-Ocean Denial Doctrine"
 tech_military_navy_doctrine_14_desc:0 "Submarines, unmanned undersea systems, mines, and long-range weapons are coordinated to make whole ocean regions costly to enter. Sea denial becomes persistent and distributed rather than dependent on a battle fleet waiting over the horizon."
 tech_military_navy_doctrine_15:0 "Persistent Global Presence"
 tech_military_navy_doctrine_15_desc:0 "Long-endurance platforms and autonomous logistics make global naval presence continuous. A fleet can pressure multiple theaters without repeatedly returning its core combat power to port."
 tech_military_navy_doctrine_16:0 "Integrated Orbital-Maritime Awareness"
 tech_military_navy_doctrine_16_desc:0 "Orbital sensors and maritime networks create an integrated picture of ships, aircraft, weather, communications, and emissions across vast areas. Hiding a fleet becomes a campaign of deception rather than a simple matter of distance."
 tech_military_navy_doctrine_17:0 "Cognitive Fleet Warfare"
 tech_military_navy_doctrine_17_desc:0 "Command systems model enemy intent, likely movements, and engagement outcomes continuously. Naval warfare becomes a contest not only of firepower but of competing machine interpretations of the same uncertain ocean."
 tech_military_navy_doctrine_18:0 "Planetary Sea Control"
 tech_military_navy_doctrine_18_desc:0 "Doctrine expands from controlling sea lanes to controlling the planetary maritime system: surface, subsurface, coastal infrastructure, orbital support, logistics, and data. Operations are planned as effects across this entire network."
 tech_military_navy_doctrine_19:0 "Interplanetary Naval Logistics"
 tech_military_navy_doctrine_19_desc:0 "Navies learn to sustain forces across cislunar and interplanetary supply chains, where maritime logistics principles are applied to spacecraft, orbital depots, and off-world bases. Distance again becomes strategic, only on a much larger map."
 tech_military_navy_doctrine_20:0 "Autonomous Grand Fleet Doctrine"
 tech_military_navy_doctrine_20_desc:0 "Human admirals oversee fleets that can plan, maneuver, replenish, and fight for extended periods with limited direct intervention. Grand strategy remains political; the execution of maritime power approaches autonomous institutional behavior."
 tech_military_nuclear_11:0 "Precision Strategic Yield"
 tech_military_nuclear_11_desc:0 "Advanced warhead design allows destructive effect to be tailored with unprecedented precision, from hardened military targets to strategic area denial. Nuclear planning shifts from choosing among crude yields toward engineering the exact physical consequences desired."
 tech_military_nuclear_12:0 "Adaptive Nuclear Deterrence"
 tech_military_nuclear_12_desc:0 "Deterrent forces continuously alter basing, alert posture, decoys, and delivery patterns in response to surveillance and enemy defenses. Strategic stability becomes a dynamic machine-managed problem rather than a static balance of arsenals."
 tech_military_nuclear_13:0 "Hypersonic Nuclear Delivery"
 tech_military_nuclear_13_desc:0 "Hypersonic and fractional-orbital delivery systems make interception extraordinarily difficult and compress political decision time. Nuclear command systems must remain credible under conditions where warning may arrive only moments before impact."
 tech_military_nuclear_14:0 "Low-Fallout Strategic Weapons"
 tech_military_nuclear_14_desc:0 "Cleaner fusion-dominant designs reduce residual fallout relative to traditional high-yield weapons, making limited strategic use more technically conceivable even if its political consequences remain catastrophic."
 tech_military_nuclear_15:0 "Autonomous Strategic Command"
 tech_military_nuclear_15_desc:0 "Machine-assisted command systems authenticate orders, model escalation, protect communications, and manage dispersed arsenals under attack. The central challenge becomes using automation without allowing an algorithm to acquire the authority to begin the end of civilization."
 tech_military_nuclear_16:0 "Deep-Penetration Nuclear Systems"
 tech_military_nuclear_16_desc:0 "Earth-penetrating and specialized nuclear systems threaten deeply buried command centers, hardened launch complexes, and subterranean infrastructure. Physical depth no longer guarantees strategic sanctuary."
 tech_military_nuclear_17:0 "Orbital Deterrence Architecture"
 tech_military_nuclear_17_desc:0 "Orbital surveillance and delivery architecture extends deterrence beyond terrestrial basing. The strategic balance now includes platforms whose trajectories and endurance are measured against the geometry of near-Earth space."
 tech_military_nuclear_18:0 "Exotic-Isotope Warheads"
 tech_military_nuclear_18_desc:0 "Rare nuclear isomers and exotic trigger mechanisms permit warheads with radically different storage, initiation, and yield characteristics. Strategic arsenals diversify beyond the familiar engineering families of fission and thermonuclear weapons."
 tech_military_nuclear_19:0 "Planetary Strategic Weapons"
 tech_military_nuclear_19_desc:0 "Weapon yields and delivery systems become capable of devastating regions on a scale that can permanently alter planetary economies and environments. Possession is less a military advantage than an assertion that no conventional defeat can be allowed to remain conventional."
 tech_military_nuclear_20:0 "Ultimate Deterrence Systems"
 tech_military_nuclear_20_desc:0 "The mature strategic complex combines extreme-yield weapons, resilient command networks, orbital assets, and automated retaliation into a deterrent system designed to survive almost any first strike. Its technical perfection is inseparable from the horror of what that perfection guarantees."
 tech_military_space_program_11:0 "Permanent Lunar Industry"
 tech_military_space_program_11_desc:0 "Permanent industrial settlements on the Moon extract local materials, manufacture bulk structures, and support operations without importing every kilogram from Earth. Space ceases to be only a destination and becomes a productive geography."
 tech_military_space_program_12:0 "Orbital Shipyards"
 tech_military_space_program_12_desc:0 "Large orbital yards assemble spacecraft too massive or fragile to be launched from a planetary surface in one piece. Ships are built where they are intended to operate, changing the economics of every mission beyond low orbit."
 tech_military_space_program_13:0 "Cislunar Logistics"
 tech_military_space_program_13_desc:0 "Depots, tugs, navigation networks, and standardized transfer vehicles turn the Earth-Moon system into a routine logistics space. Missions no longer begin as isolated expeditions carrying everything they will ever need."
 tech_military_space_program_14:0 "Mars Expedition Architecture"
 tech_military_space_program_14_desc:0 "Reusable transports, surface power, pre-positioned supplies, and orbital staging make sustained Mars expeditions possible. The problem changes from reaching Mars once to maintaining a continuing human and industrial presence there."
 tech_military_space_program_15:0 "Planetary Colonisation Systems"
 tech_military_space_program_15_desc:0 "Settlement technology integrates closed ecosystems, local resource extraction, radiation protection, and autonomous industry. Off-world colonies become capable of surviving disruptions in the supply line from Earth rather than functioning as distant research stations."
 tech_military_space_program_16:0 "Asteroid Resource Networks"
 tech_military_space_program_16_desc:0 "Robotic and human industry spreads through near-Earth asteroids, converting extraterrestrial metals, volatiles, and carbon into fuel and construction feedstock. The Solar System begins supplying its own expansion."
 tech_military_space_program_17:0 "Outer-Planet Infrastructure"
 tech_military_space_program_17_desc:0 "Power stations, communications, scientific facilities, and resource outposts extend into the outer planets. Distance measured in astronomical units becomes an infrastructure problem civilization has learned to plan around."
 tech_military_space_program_18:0 "Fusion Deep-Space Propulsion"
 tech_military_space_program_18_desc:0 "High-power fusion propulsion cuts travel times and expands payload capacity throughout the Solar System. Deep-space missions cease to be slow coast phases interrupted by brief burns and become sustained journeys under power."
 tech_military_space_program_19:0 "Interplanetary Strategic Logistics"
 tech_military_space_program_19_desc:0 "Military, civilian, and commercial logistics networks connect planets, moons, asteroids, depots, and orbital habitats. Strategic power now depends partly on the ability to sustain activity across millions of kilometers of space."
 tech_military_space_program_20:0 "Solar-System Civilisation"
 tech_military_space_program_20_desc:0 "Humanity possesses permanent, economically connected settlements and industrial systems throughout the Solar System. Spaceflight is no longer a special national program; it is one of the ordinary foundations on which civilization itself depends."
 tech_military_support_11:0 "Networked Fire Control"
 tech_military_support_11_desc:0 "Artillery, drones, radars, infantry observers, and command systems share targeting data continuously. Fire missions can be assigned to the weapon best positioned to deliver them before a traditional fire-direction center would finish processing the request."
 tech_military_support_12:0 "Electromagnetic Artillery"
 tech_military_support_12_desc:0 "Railguns and other electromagnetic launchers deliver projectiles at extreme velocity without relying on conventional propellant for every shot. Electrical infrastructure begins to substitute for ammunition chemistry in heavy fires."
 tech_military_support_13:0 "Precision Fires Networks"
 tech_military_support_13_desc:0 "Precision-guided munitions become cheap and networked enough that accuracy is expected of routine artillery rather than reserved for scarce specialist weapons. Batteries attack individual vehicles and apertures at ranges once used only for area bombardment."
 tech_military_support_14:0 "Autonomous Artillery"
 tech_military_support_14_desc:0 "Robotic guns and missile batteries displace themselves, reload, diagnose faults, and execute fire plans with minimal crews. Counter-battery warfare becomes a contest between autonomous systems trying to shoot and vanish faster than the enemy can locate them."
 tech_military_support_15:0 "Hypersonic Fires"
 tech_military_support_15_desc:0 "Hypersonic ground-launched weapons give theater forces the ability to strike time-sensitive targets hundreds or thousands of kilometers away. Operational fires blur into what previous generations would have called strategic attack."
 tech_military_support_16:0 "Swarm Munitions"
 tech_military_support_16_desc:0 "Large salvos of inexpensive cooperating munitions overwhelm defenses by sharing targets, routes, and sensor data. The individual projectile matters less than the behavior of the swarm."
 tech_military_support_17:0 "Directed-Energy Support Weapons"
 tech_military_support_17_desc:0 "High-energy beams provide rapid support against drones, missiles, exposed sensors, and lightly protected targets. Artillery formations become mixed energy-and-projectile systems with very different logistics from traditional gun lines."
 tech_military_support_18:0 "Orbital Reconnaissance Fires"
 tech_military_support_18_desc:0 "Orbital sensors deliver persistent targeting and battle-damage information directly to ground fire networks. The sensor-to-shooter chain can cross space and return a firing solution before a target has moved far enough to matter."
 tech_military_support_19:0 "Cognitive Fire Support"
 tech_military_support_19_desc:0 "Cognitive fire-control systems predict movement, choose ammunition, deconflict airspace, and coordinate massed effects across entire fronts. Human commanders define intent while software manages the impossible arithmetic of modern fires."
 tech_military_support_20:0 "Planetary Precision Fires"
 tech_military_support_20_desc:0 "Planetary sensor networks and long-range precision weapons allow ground forces to contribute fires across continental distances. Artillery becomes less a weapon located behind a brigade and more a distributed strategic fire network."
 tech_military_theory_11:0 "Multi-Domain Operations"
 tech_military_theory_11_desc:0 "Land, air, sea, space, cyber, and information operations are planned as mutually dependent parts of a single campaign. A commander seeks to create dilemmas across domains rather than win each battlefield in isolation."
 tech_military_theory_12:0 "Machine-Speed Command"
 tech_military_theory_12_desc:0 "Command networks process intelligence and issue local coordination at machine speed while preserving human authority over objectives and escalation. The tempo of operations accelerates beyond what voice reports and staff meetings can sustain."
 tech_military_theory_13:0 "Distributed Mission Command"
 tech_military_theory_13_desc:0 "Units receive broad intent and operate through resilient local networks even when higher headquarters is jammed or destroyed. Central planning and decentralized initiative are reconciled through shared data and machine support."
 tech_military_theory_14:0 "Autonomous Operational Art"
 tech_military_theory_14_desc:0 "Operational plans are continuously recalculated as autonomous systems report losses, opportunities, and changing terrain. Campaign design becomes a living process running throughout the battle rather than a document completed before it."
 tech_military_theory_15:0 "Cognitive Warfare"
 tech_military_theory_15_desc:0 "Military power is directed at perception, decision quality, social cohesion, and machine inference as deliberately as it is directed at physical forces. Deception and information warfare target both human minds and the algorithms helping them think."
 tech_military_theory_16:0 "Resilient Battlespace Theory"
 tech_military_theory_16_desc:0 "Doctrine assumes communications, satellites, logistics, and command centers will be attacked from the first moment of war. Forces are designed to degrade gracefully instead of depending on a perfectly functioning information environment."
 tech_military_theory_17:0 "Human-Machine Command"
 tech_military_theory_17_desc:0 "Human commanders and synthetic staff systems divide planning according to comparative advantage: machines explore vast option spaces while people judge political purpose, acceptable risk, and moral responsibility."
 tech_military_theory_18:0 "Planetary Campaigning"
 tech_military_theory_18_desc:0 "Campaigns span the planet as routine logistics, sensing, and strike capabilities erase many traditional theater boundaries. Regional wars can be reinforced and influenced directly from almost anywhere on Earth."
 tech_military_theory_19:0 "Interplanetary Strategy"
 tech_military_theory_19_desc:0 "Strategy incorporates planets, moons, orbital routes, communication delay, and extraterrestrial industry. The fundamental questions of lines of communication and concentration of force return on scales no terrestrial general ever confronted."
 tech_military_theory_20:0 "Post-Human Military Science"
 tech_military_theory_20_desc:0 "Military science adapts to forces containing enhanced humans, autonomous machines, synthetic cognition, and weapons operating at machine reaction times. Doctrine must decide not merely how to command new tools, but what kinds of actors may legitimately exercise violence."
 tech_mining_11:0 "Autonomous Deep Mining"
 tech_mining_11_desc:0 "Autonomous equipment follows ore bodies deep below the surface where heat, pressure, and distance make continuous human work dangerous and expensive. Mines expand downward while their control rooms remain far from the face."
 tech_mining_12:0 "Precision Ore Sorting"
 tech_mining_12_desc:0 "Sensor-rich crushing and sorting systems separate valuable mineral grains before entire mountains of waste are hauled and processed. Mines produce more useful material by moving less useless rock."
 tech_mining_13:0 "Robotic Subsurface Extraction"
 tech_mining_13_desc:0 "Robotic drills, haulage, support systems, and inspection platforms turn underground extraction into a remotely supervised industrial process. Dangerous spaces are occupied by machines first and people only when necessary."
 tech_mining_14:0 "In-Situ Resource Processing"
 tech_mining_14_desc:0 "Ore is crushed, leached, separated, or transformed underground so that mines export concentrated products instead of immense volumes of low-value material. Processing becomes part of the geology-facing extraction system."
 tech_mining_15:0 "Ultra-Deep Mining"
 tech_mining_15_desc:0 "Extreme-temperature machinery and advanced ground control reach deposits previously written off as too deep to exploit. The economically accessible crust extends kilometers farther beneath civilization."
 tech_mining_16:0 "Bioleaching Megasystems"
 tech_mining_16_desc:0 "Engineered microbes dissolve and concentrate metals from low-grade ores and waste streams on industrial scales. Deposits once too diffuse for mechanical processing become useful biological feedstocks."
 tech_mining_17:0 "Self-Replicating Mining Systems"
 tech_mining_17_desc:0 "Mining systems manufacture replacement parts, expand tunnels, survey geology, and deploy new machines with little external labor. Remote extraction complexes begin to reproduce much of their own productive infrastructure."
 tech_mining_18:0 "Crustal Resource Engineering"
 tech_mining_18_desc:0 "Advanced drilling, fracture control, fluid circulation, and geophysical modeling treat the crust itself as an engineered resource system. Extraction no longer follows only naturally convenient veins and reservoirs."
 tech_mining_19:0 "Planetary Resource Mapping"
 tech_mining_19_desc:0 "Planetary sensing integrates seismic tomography, orbital spectroscopy, borehole data, and machine inference into detailed maps of resources far below the surface. Prospecting becomes less an art of finding clues and more a science of seeing through rock."
 tech_mining_20:0 "Programmable Extraction"
 tech_mining_20_desc:0 "Programmable chemical, biological, and robotic extraction targets desired elements directly within complex formations. Mining approaches a future in which the valuable atom can be separated from the surrounding geology with minimal bulk disturbance."
 tech_philosophy_11:0 "Lifelong Adaptive Education"
 tech_philosophy_11_desc:0 "Education becomes a continuous adult institution rather than a phase completed before working life. Adaptive curricula follow people across decades, rebuilding skills as professions and technologies change around them."
 tech_philosophy_12:0 "Neural Learning Interfaces"
 tech_philosophy_12_desc:0 "Stable neural interfaces allow training systems to observe attention, confusion, memory formation, and sensory processing directly. Teaching can respond to what a learner is actually experiencing rather than relying only on tests and self-report."
 tech_philosophy_13:0 "AI Research Partners"
 tech_philosophy_13_desc:0 "Artificial research partners read entire literatures, design experiments, check proofs, challenge assumptions, and maintain long-running scientific programs alongside human scholars. The practical size of a research team expands far beyond its biological members."
 tech_philosophy_14:0 "Immersive Knowledge Environments"
 tech_philosophy_14_desc:0 "Immersive simulations turn abstract knowledge into environments that can be explored, manipulated, and repeated. Students learn engineering, medicine, history, and science partly by inhabiting convincing models of the systems they study."
 tech_philosophy_15:0 "Cognitive Augmentation"
 tech_philosophy_15_desc:0 "Safe cognitive augmentation improves memory, focus, pattern recognition, and access to external knowledge. Education increasingly concerns how minds and tools are coupled rather than how much information a person can retain unaided."
 tech_philosophy_16:0 "Synthetic Tutors"
 tech_philosophy_16_desc:0 "Synthetic tutors provide individual instruction at essentially unlimited scale, remembering every learner's history and adjusting explanation minute by minute. High-quality teaching becomes far less constrained by the number of exceptional human instructors."
 tech_philosophy_17:0 "Collective Intelligence Education"
 tech_philosophy_17_desc:0 "Research communities link human and machine contributors into persistent collective problem-solving systems. Discovery emerges from coordinated networks whose combined memory and analytical reach exceed any individual institution."
 tech_philosophy_18:0 "Direct Skill Encoding"
 tech_philosophy_18_desc:0 "Neural encoding and highly targeted stimulation accelerate the acquisition of specific motor and cognitive skills. Learning is not instantaneous, but the boundary between practice and direct neurological intervention becomes increasingly blurred."
 tech_philosophy_19:0 "Post-Biological Scholarship"
 tech_philosophy_19_desc:0 "Scholarship expands beyond the assumptions of a purely biological human lifespan and mind. Long-lived researchers, synthetic minds, and hybrid cognitive systems pursue questions over centuries and preserve continuity no normal academic career could maintain."
 tech_philosophy_20:0 "Civilization-Scale Knowledge Systems"
 tech_philosophy_20_desc:0 "Knowledge institutions coordinate research, education, simulation, archival memory, and machine reasoning across entire civilizations. Science becomes an enduring cognitive infrastructure comparable in scale to the energy grid or transportation network."
 tech_politics_11:0 "Algorithmic Administration"
 tech_politics_11_desc:0 "Public administrations use machine systems to route cases, detect anomalies, enforce rules, and allocate routine resources with far less clerical delay. Political authority remains human, but much of the machinery of the state becomes computational."
 tech_politics_12:0 "Deliberative Digital Governance"
 tech_politics_12_desc:0 "Large-scale digital deliberation allows citizens, experts, institutions, and representatives to test proposals and expose tradeoffs before legislation hardens into partisan slogans. Participation expands without requiring every decision to become a plebiscite."
 tech_politics_13:0 "Predictive Public Policy"
 tech_politics_13_desc:0 "Governments model likely effects of regulations, budgets, demographic shifts, and infrastructure decisions before implementation. Policy becomes more experimental and iterative, though predictions inevitably become new objects of political conflict."
 tech_politics_14:0 "Adaptive Constitutionalism"
 tech_politics_14_desc:0 "Constitutions and administrative law develop mechanisms for institutions that must change faster than traditional amendment cycles. Stable rights are preserved while procedures and delegated systems can adapt to technological and social conditions."
 tech_politics_15:0 "Automated State Capacity"
 tech_politics_15_desc:0 "Routine licensing, benefits, taxation, procurement, compliance, and records management operate with minimal manual processing. State capacity expands not through larger clerical armies but through institutions capable of executing decisions consistently at machine scale."
 tech_politics_16:0 "Networked Civic Institutions"
 tech_politics_16_desc:0 "Civic organizations, local governments, parties, professional bodies, and public services coordinate through shared digital institutions rather than isolated bureaucratic silos. Political participation becomes more networked and less dependent on physical offices."
 tech_politics_17:0 "Machine-Mediated Governance"
 tech_politics_17_desc:0 "Machine systems mediate negotiations, draft policy alternatives, detect contradictions, and manage implementation across huge administrations. The political question shifts from whether machines are used to how their goals, accountability, and authority are constrained."
 tech_politics_18:0 "Planetary Political Institutions"
 tech_politics_18_desc:0 "Planetary problems such as climate, orbital traffic, migration, pandemics, and shared infrastructure create institutions whose jurisdiction exceeds the traditional nation-state. Sovereignty becomes layered without disappearing."
 tech_politics_19:0 "Post-National Administration"
 tech_politics_19_desc:0 "Citizenship, taxation, regulation, and public services increasingly operate across overlapping jurisdictions and communities. States remain powerful, but administration is no longer assumed to map neatly onto a single territorial nation."
 tech_politics_20:0 "Civilizational Statecraft"
 tech_politics_20_desc:0 "Government becomes capable of administering civilization-scale systems spanning Earth and permanent off-world populations. Statecraft must reconcile immense technological capacity with the enduring problems of legitimacy, representation, coercion, and human disagreement."
 tech_population_11:0 "Precision Nutrition"
 tech_population_11_desc:0 "Nutrition is tailored to individual metabolism, microbiome, genetics, and disease risk rather than broad population averages. Public health systems treat food as a continuously adjusted component of medicine."
 tech_population_12:0 "Regenerative Public Health"
 tech_population_12_desc:0 "Regenerative therapies repair organs and tissues before chronic damage becomes irreversible. Health systems begin to restore function that earlier medicine could only manage or replace."
 tech_population_13:0 "Longevity Medicine"
 tech_population_13_desc:0 "Treatments that slow cellular damage and preserve organ function extend healthy adult life substantially. Aging becomes a modifiable risk process rather than an untouchable background condition."
 tech_population_14:0 "Reproductive Genomics"
 tech_population_14_desc:0 "Embryonic screening, gene correction, and reproductive medicine eliminate many inherited diseases while opening profound social debates about which traits should ever be deliberately altered."
 tech_population_15:0 "Organ Renewal"
 tech_population_15_desc:0 "Bioprinting, cultured organs, and in-situ regeneration make organ failure increasingly treatable without waiting for donors. Replacement becomes a planned medical procedure rather than a desperate allocation of scarce human tissue."
 tech_population_16:0 "Senescence Reversal"
 tech_population_16_desc:0 "Therapies target the molecular and cellular mechanisms that accumulate with age, reversing some forms of senescence instead of merely slowing them. Lifespan begins to separate sharply from the historical limits of human biology."
 tech_population_17:0 "Synthetic Biology Healthcare"
 tech_population_17_desc:0 "Synthetic cells, engineered microbes, programmable immune systems, and molecular factories operate inside the body as medical infrastructure. Treatment becomes an ongoing partnership between biology and designed organisms."
 tech_population_18:0 "Adaptive Human Physiology"
 tech_population_18_desc:0 "Human physiology can be deliberately adapted to extreme climates, pathogens, low gravity, radiation, and unusual diets. Medicine begins preparing populations for environments rather than only adapting environments for populations."
 tech_population_19:0 "Radical Longevity"
 tech_population_19_desc:0 "Combined genetic, regenerative, cellular, and neurological medicine extends healthy life far beyond the expectations of the early twenty-first century. Demography is transformed as 'old age' no longer corresponds to the same biological decline."
 tech_population_20:0 "Engineered Human Vitality"
 tech_population_20_desc:0 "Human bodies are maintained by continuous biological monitoring, periodic regeneration, and engineered repair systems throughout exceptionally long lives. Health becomes an actively managed technological state rather than a gradual surrender to accumulated damage."
 tech_sea_infrastructure_11:0 "Autonomous Port Complexes"
 tech_sea_infrastructure_11_desc:0 "Ports coordinate berths, cranes, customs, storage, autonomous trucks, and ships as one machine-managed complex. Vessels spend less time waiting for human schedules and more time moving cargo."
 tech_sea_infrastructure_12:0 "Smart Maritime Corridors"
 tech_sea_infrastructure_12_desc:0 "Merchant traffic shares live routing, weather, port capacity, and cargo information across whole ocean basins. Maritime corridors become managed logistics infrastructure rather than paths ships independently choose to follow."
 tech_sea_infrastructure_13:0 "Global Sealift Systems"
 tech_sea_infrastructure_13_desc:0 "High-capacity sealift fleets and standardized transfer systems make the rapid movement of entire industrial and military supply chains routine. Oceans cease to be logistical gaps between terrestrial networks."
 tech_sea_infrastructure_14:0 "Molecular Shipbuilding"
 tech_sea_infrastructure_14_desc:0 "Advanced fabrication yards print and assemble large hull sections, machinery, and complex structures with far less tooling. Shipyards can change classes and designs without rebuilding their entire industrial base."
 tech_sea_infrastructure_15:0 "Oceanic Logistics Networks"
 tech_sea_infrastructure_15_desc:0 "Ports, merchant fleets, shipyards, inland logistics, and maritime communications are coordinated as a single oceanic freight system. Capacity can shift between routes and ports before local congestion becomes a crisis."
 tech_sea_infrastructure_16:0 "Self-Operating Ports"
 tech_sea_infrastructure_16_desc:0 "Autonomous cranes, tugs, inspection craft, yard vehicles, and administrative systems allow major ports to operate around the clock with minimal direct handling. The harbor becomes an industrial robot measured in square kilometers."
 tech_sea_infrastructure_17:0 "Adaptive Merchant Shipping"
 tech_sea_infrastructure_17_desc:0 "Merchant ships alter routes, operating modes, maintenance schedules, and energy use continuously in response to cargo demand and ocean conditions. The commercial fleet becomes adaptive rather than timetable-bound."
 tech_sea_infrastructure_18:0 "Planetary Sealift"
 tech_sea_infrastructure_18_desc:0 "Global sealift is planned at planetary scale, integrating ports, megaships, autonomous feeders, and inland corridors. Moving millions of tonnes across oceans becomes a controllable infrastructure service rather than a loose market of individual voyages."
 tech_sea_infrastructure_19:0 "Self-Repairing Megaships"
 tech_sea_infrastructure_19_desc:0 "Self-diagnosing hulls, robotic repair systems, and advanced materials allow large ships to repair damage during voyages. Drydock intervals lengthen and merchant vessels remain productive for far greater portions of their service lives."
 tech_sea_infrastructure_20:0 "Integrated Oceanic Infrastructure"
 tech_sea_infrastructure_20_desc:0 "Oceanic transport reaches full integration with terrestrial and near-space logistics. Ports and ships form the maritime layer of a planetary circulation system in which cargo can be routed from factory to destination without institutional breaks between modes."
 tech_services_11:0 "Cognitive Office Systems"
 tech_services_11_desc:0 "Office work is reorganized around cognitive assistants that draft, reconcile, search, schedule, and monitor routine processes continuously. Clerical effort shifts from moving information between systems toward supervising what automated systems decide to do with it."
 tech_services_12:0 "Autonomous Professional Services"
 tech_services_12_desc:0 "Professional firms embed expert machine systems into law, engineering, medicine, accounting, design, and consulting. A single professional can direct analytical capacity that once required entire teams of junior staff."
 tech_services_13:0 "Algorithmic Bureaucracy"
 tech_services_13_desc:0 "Bureaucratic procedures are encoded into auditable machine workflows that can process enormous case volumes without arbitrary delay. Administration becomes faster, but questions of exceptions and accountability grow more important than ever."
 tech_services_14:0 "Immersive Service Delivery"
 tech_services_14_desc:0 "Remote service environments reproduce shared workspaces, demonstrations, consultations, and entertainment with near-physical presence. Service industries become less constrained by where provider and client happen to live."
 tech_services_15:0 "Synthetic Knowledge Work"
 tech_services_15_desc:0 "Knowledge workers collaborate with synthetic agents capable of maintaining context across years of documents, decisions, and relationships. Organizations acquire institutional memories that do not leave when employees resign."
 tech_services_16:0 "Distributed Service Economies"
 tech_services_16_desc:0 "Service firms distribute specialized work globally through persistent digital institutions and machine coordination. Small offices can participate in capabilities once restricted to immense metropolitan professional clusters."
 tech_services_17:0 "Machine-Mediated Administration"
 tech_services_17_desc:0 "Machine agents negotiate appointments, contracts, compliance, procurement, and support directly with other machine agents. An increasing share of the service economy takes place continuously without a person present at either end of each transaction."
 tech_services_18:0 "Cognitive Enterprise Networks"
 tech_services_18_desc:0 "Enterprises connect staff, clients, machine agents, knowledge bases, and operational systems into shared cognitive networks. The organization begins to think and remember at a level above any individual employee."
 tech_services_19:0 "Autonomous Institutional Management"
 tech_services_19_desc:0 "Institutions automate management of routine staffing, resource allocation, performance monitoring, and service delivery while retaining human control over exceptional and political decisions. Administrative scale becomes less dependent on managerial headcount."
 tech_services_20:0 "Post-Labor Service Systems"
 tech_services_20_desc:0 "In mature service economies, machines perform most routine clerical and analytical labor while humans concentrate in roles requiring responsibility, trust, creativity, judgment, and social legitimacy. 'Post-labor' does not mean no work; it means a radically different composition of work."
 tech_urbanization_11:0 "Arcology Systems"
 tech_urbanization_11_desc:0 "Arcologies combine housing, commerce, utilities, transit, food systems, and public space inside structures large enough to function as districts. Urban density becomes an engineered ecosystem rather than simply more floors on expensive land."
 tech_urbanization_12:0 "Autonomous City Utilities"
 tech_urbanization_12_desc:0 "Water, waste, power, transport, maintenance, and emergency systems coordinate themselves continuously across entire cities. Urban services respond to failures and demand before residents ever file a complaint."
 tech_urbanization_13:0 "Vertical Urban Ecologies"
 tech_urbanization_13_desc:0 "Buildings integrate agriculture, habitat, cooling, water treatment, and public landscapes vertically. The distinction between architecture and urban ecology weakens as towers become inhabited environmental systems."
 tech_urbanization_14:0 "Self-Repairing Cities"
 tech_urbanization_14_desc:0 "Robotic maintenance and self-healing materials repair roads, pipes, facades, structures, and utilities while the city remains in use. The permanent backlog of urban decay can finally be attacked continuously instead of project by project."
 tech_urbanization_15:0 "Metropolitan Resource Loops"
 tech_urbanization_15_desc:0 "Heat, water, nutrients, materials, and waste circulate through metropolitan closed loops. Cities consume fewer virgin resources not by becoming smaller, but by learning to reuse the immense flows already passing through them."
 tech_urbanization_16:0 "Adaptive Megacity Infrastructure"
 tech_urbanization_16_desc:0 "Transit, utilities, land use, construction, and building operation adjust dynamically to population and economic change. A megacity can reallocate capacity without waiting decades for a new master plan to become obsolete."
 tech_urbanization_17:0 "Climate-Controlled Urbanism"
 tech_urbanization_17_desc:0 "Large urban environments actively control heat, humidity, air quality, flooding, and solar exposure at neighborhood scale. Climate resilience evolves from defensive engineering into continuous environmental management."
 tech_urbanization_18:0 "Planetary Urban Networks"
 tech_urbanization_18_desc:0 "Cities across continents coordinate logistics, energy, information, migration, and specialized services as nodes of a planetary urban system. The effective economy of a metropolis extends far beyond its traditional commuting region."
 tech_urbanization_19:0 "City-Scale Artificial Ecologies"
 tech_urbanization_19_desc:0 "Engineered ecosystems maintain biodiversity, cooling, water cycles, waste processing, and food production inside dense urban regions. The city becomes an artificial ecology capable of supporting both human civilization and deliberate living systems."
 tech_urbanization_20:0 "Mature Ecumenopolis Systems"
 tech_urbanization_20_desc:0 "Urbanization reaches the mature ecumenopolis: enormous continuous networks of dense settlement whose infrastructure, ecology, logistics, and governance function at planetary scale. Nature is not absent, but increasingly designed into the fabric of civilization itself."
